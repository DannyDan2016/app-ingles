  - id: ent-qa-05
    nivel: B1
    pregunta: "Can you explain the test pyramid?"
    respuesta: "The test pyramid is a way to decide how many tests of each type we need. At the bottom, we have many unit tests, which are fast and cheap. In the middle, there are fewer integration tests, which check that parts of the system work together. At the top, we have a small number of end-to-end tests, which are slower and break more easily. In my last project, we had too many end-to-end tests, so the pipeline took forty minutes. We moved many checks to unit and API level, and it dropped to twelve minutes."
    estructuras: ["... is a way to decide ...", "At the bottom, we have ..., which are ...", "In my last project, we had too many ..., so ...", "We moved ... to ..., and it dropped to ...", "..., which check that ... work together"]
