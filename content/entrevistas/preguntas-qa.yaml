  - id: ent-qa-10
    nivel: B2
    pregunta: "You have two days to test a new feature before the release. How do you prioritize?"
    respuesta: "I would use a risk-based approach. First, I would ask the team what the feature does and which parts would hurt the business most if they failed, for example payments or personal data. Those areas should be tested first and in more depth. For lower-risk parts, a quick exploratory session would probably be enough. If I found a serious defect, I would report it immediately instead of waiting until the end. I would also make clear which areas had not been covered, so the decision to release is made with full information."
    estructuras: ["I would use a ... approach.", "First, I would ask ... which parts would ... if they failed", "Those areas should be tested first and in more depth.", "If I found ..., I would report it immediately instead of ...", "I would also make clear which areas had not been covered, so ..."]
    vocabulario: [{ termino: "risk-based", traduccion: "basado en riesgo" }, { termino: "exploratory testing", traduccion: "pruebas exploratorias" }, { termino: "coverage", traduccion: "cobertura" }, { termino: "defect", traduccion: "defecto" }]
  - id: ent-qa-11
    nivel: B2
    pregunta: "How do you manage test data so that automated tests stay reliable?"
    respuesta: "Reliable tests should not depend on data that someone else may have changed. My preference is that each test creates the data it needs, usually through an API, and removes it afterwards. That way tests can run in parallel without affecting each other. For larger scenarios, I would use a database snapshot that is restored before each run. Real customer data must never be used; it should be anonymized or replaced by generated values. In one project, shared accounts caused random failures, until we gave every test its own user."
    estructuras: ["Reliable tests should not depend on ...", "My preference is that each test ...", "That way tests can ... without ...", "... must never be used; it should be ...", "..., until we gave every test ..."]
