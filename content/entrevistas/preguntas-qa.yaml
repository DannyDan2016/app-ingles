preguntas:
  - id: ent-qa-01
    nivel: A2
    pregunta: "What is a test case?"
    respuesta: "A test case is a list of steps to check one thing in an application. It has a name, some steps, and an expected result. For example, I test the login page. Step one: I open the page. Step two: I type a correct email and password. Step three: I click the button. The expected result is that I see the home page. If I see an error, the test fails. I write clear test cases, so other people can repeat them."
