  - id: ent-qa-02
    nivel: A2
    pregunta: "What do you write in a bug report?"
    respuesta: "I write a short title that explains the problem. Then I write the steps to reproduce the bug. I also write what I expected and what happened. For example: I click the save button, and nothing happens. I add the browser, the device and the version of the app. A screenshot is very useful, so I always add one. I do not write long texts. The developer must understand the problem quickly and fix it."
    estructuras: ["I write a short title that ...", "Then I write the steps to reproduce ...", "I also write what I expected and what ...", "For example: I click ..., and nothing happens.", "The developer must understand ..."]
