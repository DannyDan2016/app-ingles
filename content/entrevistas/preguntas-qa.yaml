  - id: ent-qa-06
    nivel: B1
    pregunta: "What is a flaky test, and how do you find the cause?"
    respuesta: "A flaky test is a test that sometimes passes and sometimes fails without any change in the code. It is a problem because the team stops trusting the results. When I find one, I first run it many times to see how often it fails. Then I check the usual causes: fixed waits, shared data between tests, or slow network responses. Last year, one of our tests failed only in the pipeline. The reason was that it clicked a button before the page finished loading. I replaced the fixed wait with a proper condition, and the problem disappeared."
