  - id: ent-qa-07
    nivel: B1
    pregunta: "How do you test an API?"
    respuesta: "First, I read the documentation to understand the endpoints, the parameters and the possible responses. Then I test the normal case, for example creating a user with valid data and checking that the status code is 201. After that, I try the error cases, such as missing fields, wrong types or requests without a token, and I check that the API returns 400 or 401 with a clear message. I also check the response body, not only the status code. In my last job, I automated these checks with a collection of requests, and they ran after every deployment. That way we found a broken endpoint before the customers did."
    estructuras: ["First, I read ... to understand ...", "Then I test the normal case, for example ...", "After that, I try the error cases, such as ..., and I check that ...", "I also check ..., not only ...", "That way we found ... before ... did."]
