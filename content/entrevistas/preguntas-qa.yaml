  - id: ent-qa-12
    nivel: B2
    pregunta: "What are quality gates in a CI/CD pipeline, and how would you set them up?"
    respuesta: "A quality gate is a condition that a change must satisfy before it moves to the next stage. For example, a pull request cannot be merged if the unit tests do not pass, if coverage on the new code drops below an agreed level, or if a security scan finds a critical issue. I would start with a few strict rules instead of many, because too many gates slow the team down and people begin to ignore them. Fast checks should run on every change, while slower ones, like the full end-to-end suite, could run nightly or before a release. If a flaky test kept blocking a gate, I would fix or quarantine the test rather than remove the gate."
