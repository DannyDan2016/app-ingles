  - id: ent-qa-08
    nivel: B1
    pregunta: "What is regression testing, and when do you automate it?"
    respuesta: "Regression testing checks that old features still work after we change the code. It is important because a small change can break something that nobody expected. I automate regression tests when they are stable and repeated often, for example the checkout process in an online shop. I do not automate things that change every week, because the maintenance is too expensive. Last quarter, our regression suite caught a bug in the discount calculation just before a release. Without it, we would have lost money."
    estructuras: ["... checks that ... still work after ...", "It is important because ...", "I automate ... when they are ... and ...", "I do not automate ..., because ...", "Without it, we would have ..."]
