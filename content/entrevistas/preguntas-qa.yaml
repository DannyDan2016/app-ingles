  - id: ent-qa-09
    nivel: B2
    pregunta: "How would you reduce flaky tests in a large CI pipeline?"
    respuesta: "I would approach it systematically. First, I would measure the problem: which tests fail most often and how much time the team loses. Tests that are known to be unstable should be moved to a quarantine, so they do not block releases, but they must be fixed within an agreed time, for example two weeks. Then I would address the root causes, such as shared state, hard-coded waits and dependencies on external services, which can be replaced by mocks. I would also be careful with automatic retries: if a test only passed after a retry, that should be reported, not hidden. Finally, a dashboard with the failure rate keeps everyone accountable."
    estructuras: ["I would approach it systematically.", "First, I would measure ...", "Tests that are known to be ... should be moved to ...", "I would also be careful with ...: if ..., that should be reported, not hidden.", "Finally, ... keeps everyone accountable."]
