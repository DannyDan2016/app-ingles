  - id: ent-qa-03
    nivel: A2
    pregunta: "What is the difference between manual testing and automated testing?"
    respuesta: "In manual testing, a person uses the application and checks the results. In automated testing, a program runs the tests. Manual tests are good for new features, because I can see small problems with my eyes. Automated tests are good for tasks that we repeat many times. For example, we run the login test every day with a script. It is fast and it does not get tired. I think we need both types. Automation does not replace people."
    estructuras: ["In manual testing, ... In automated testing, ...", "... are good for ..., because ...", "For example, we run ... every day.", "It is fast and it does not ...", "I think we need both."]
