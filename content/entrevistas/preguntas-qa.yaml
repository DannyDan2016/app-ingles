  - id: ent-qa-04
    nivel: A2
    pregunta: "What do you do when an automated test fails?"
    respuesta: "First, I read the error message. Then I run the test again, because sometimes the problem is the network. If it fails again, I check the screenshot or the video from the test. I look at the last code changes too. Sometimes the application has a bug, and I write a bug report. Other times the test is old, and I update it. Yesterday a button had a new name, so the test could not find it. I fixed the test in five minutes."
    estructuras: ["First, I read ... Then I ...", "..., because sometimes the problem is ...", "If it fails again, I check ...", "Sometimes ..., and I ... Other times ...", "Yesterday ..., so ..."]
