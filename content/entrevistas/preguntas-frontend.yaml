  - id: ent-frontend-12
    nivel: B2
    pregunta: "How do you decide whether to build a UI component yourself or use an existing library?"
    respuesta: "I weigh the cost of building and maintaining against the cost of adopting. For complex, well-solved problems, such as accessible dropdowns or date pickers, I would prefer a mature library, because getting keyboard support and edge cases right takes a lot of time. If the component is simple or very specific to our product, writing it ourselves avoids extra dependencies. Before adding a package, I check its bundle size, how active the maintenance is, and whether it works with our framework. In one project, a heavy library was used for a single button style, and it should have been replaced by a few lines of CSS."
