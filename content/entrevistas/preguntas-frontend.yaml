  - id: ent-frontend-08
    nivel: B1
    pregunta: "How do you test a frontend application?"
    respuesta: "I use different types of tests for different goals. For small pieces of logic, like a function that formats a date, I write unit tests, because they are fast. For components, I test what the user sees and does, for example typing in a form and clicking the button, instead of checking the internal details. For the most important flows, such as login, I add a few end-to-end tests in a real browser. I do not try to test everything with end-to-end tests, because they are slow. In my last team, this balance gave us confidence without making the pipeline too long."
