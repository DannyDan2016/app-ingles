  - id: ent-frontend-10
    nivel: B2
    pregunta: "A page re-renders too often and feels slow. How would you diagnose and fix it?"
    respuesta: "I would begin with the profiler in the developer tools to see which components render and how long they take. In my experience, the cause is often a state that lives too high in the tree, so a small change updates a large part of the page. In that case, I would move the state closer to where it is used. Expensive calculations could be memoized, but I would only do it when the measurements showed a real benefit, since memoization adds complexity. For long lists, virtualization is usually the best solution. Afterwards, I would measure again to confirm that the interaction feels smoother."
    estructuras: ["I would begin with ... to see which ...", "In my experience, the cause is often ...", "In that case, I would move ... closer to ...", "... could be memoized, but I would only do it when ...", "Afterwards, I would measure again to confirm that ..."]
