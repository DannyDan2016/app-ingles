  - id: ent-frontend-04
    nivel: A2
    pregunta: "How do you debug a problem in the browser?"
    respuesta: "I open the developer tools in the browser. First, I look at the console, because it shows the errors in red. Then I read the message and the line of the code. If the problem is the style, I use the Elements tab to see the CSS of the button or the text. If the data is wrong, I look at the Network tab to see the request and the response from the server. Yesterday, an image did not appear because the URL was wrong. I found the problem in two minutes."
