  - id: ent-frontend-03
    nivel: A2
    pregunta: "What is React, and why do developers use it?"
    respuesta: "React is a JavaScript library to build user interfaces. In React, I make small pieces called components. For example, a button, a menu or a product card. I can use the same component many times in the application. When the data changes, React updates the page quickly. I like React because the code is organized and easy to read. Also, there are many tutorials and tools, so it is easy to find help. I have used React in two projects."
