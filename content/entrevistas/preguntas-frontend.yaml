  - id: ent-frontend-11
    nivel: B2
    pregunta: "How do you protect a frontend application against common security problems like XSS?"
    respuesta: "XSS happens when an attacker manages to run their own script in the page of another user. The first defense is that user input should never be inserted into the page as raw HTML. Modern frameworks escape text by default, so I avoid the features that bypass this unless the content has been sanitized by a trusted library. A Content Security Policy adds another layer, because it limits which scripts the browser is allowed to run. I would also keep session tokens in secure, HTTP-only cookies rather than in local storage, so that an injected script cannot read them, and I would set the SameSite attribute to reduce CSRF. And, of course, the server must validate everything again, since the frontend can always be bypassed."
