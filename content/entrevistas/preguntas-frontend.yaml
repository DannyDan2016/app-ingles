  - id: ent-frontend-02
    nivel: A2
    pregunta: "What is responsive design?"
    respuesta: "Responsive design means that a website works well on all screen sizes. The same page looks good on a phone, a tablet and a computer. For example, on a phone the menu is behind a small button and the text is in one column. On a computer, there is more space, so we can show two or three columns. I use CSS media queries to change the layout. I always test my pages on a small screen first. Many users visit websites with their phones, so this is very important."
