  - id: ent-frontend-09
    nivel: B2
    pregunta: "What is the difference between client-side rendering and server-side rendering, and when would you choose each one?"
    respuesta: "With client-side rendering, the browser downloads the JavaScript and builds the page itself. With server-side rendering, the server sends HTML that is already complete, so the user sees content sooner and search engines can read it more easily. I would choose server rendering for public pages where speed and visibility matter, like a product catalog. For a private dashboard that is used after logging in, client rendering might be enough. Nowadays many frameworks allow a mix of both, so the decision can be made per page. If the team were small, I would keep the setup as simple as possible."
    estructuras: ["With ..., the browser ... With ..., the server ...", "..., so the user sees ... sooner and ... can ...", "I would choose ... for ... where ... matter", "... might be enough.", "If the team were small, I would ..."]
