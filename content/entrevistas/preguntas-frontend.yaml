  - id: ent-frontend-06
    nivel: B1
    pregunta: "How do you make a website accessible?"
    respuesta: "I start with semantic HTML, so I use real buttons, headings and labels instead of generic elements. This helps screen readers understand the page. I also check that everything can be used with the keyboard and that the focus is always visible. For images, I write a short alternative text. Another important point is color contrast, because some users cannot read light text on a light background. In my last project, I used an automatic tool to find problems, but I also tested with a screen reader, because tools do not find everything."
