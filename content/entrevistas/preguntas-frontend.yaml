  - id: ent-frontend-05
    nivel: B1
    pregunta: "How do you manage state in a React application?"
    respuesta: "It depends on how many components need the data. If only one component uses it, I keep the state inside that component with a hook like useState. When a few nearby components need the same value, I move it to their common parent. For data that many parts of the application share, such as the logged-in user, I use the context API or a small state library. The server data, like a list of products, is different, so I use a tool that handles caching and loading states. In my last project, this separation made the code much easier to understand."
