  - id: ent-frontend-01
    nivel: A2
    pregunta: "What is the difference between HTML, CSS and JavaScript?"
    respuesta: "HTML is the structure of a web page. It shows the title, the text, the images and the buttons. CSS is the style. It gives colors, sizes and positions to the elements. JavaScript is the behavior. For example, when a user clicks a button, JavaScript can open a menu. I like to think about a house. HTML is like the walls, CSS is like the paint, and JavaScript is like the electricity. I use the three of them every day."
