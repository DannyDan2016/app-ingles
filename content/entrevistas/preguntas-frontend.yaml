  - id: ent-frontend-07
    nivel: B1
    pregunta: "How would you improve the loading speed of a web page?"
    respuesta: "First, I would measure the page with a tool like Lighthouse to see what the real problem is. Very often the images are too big, so I would compress them and use modern formats. Then I would load the heavy parts only when they are needed, for example with lazy loading. I would also reduce the size of the JavaScript bundle, because the browser must download and run it before the page becomes interactive. In a previous project, we removed an unused library, and the page loaded one second faster. Small changes like this can have a big effect."
