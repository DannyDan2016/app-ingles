  - id: ent-ia-02
    nivel: A2
    pregunta: "What is a prompt?"
    respuesta: "A prompt is the text that I write to an AI model. It tells the model what I want. For example, I can write: \"Write a function that adds two numbers in Python.\" If my prompt is not clear, the answer is often bad. If my prompt is clear and specific, the answer is better. I usually say what language I use and what result I want. Sometimes I also add an example. A good prompt saves me a lot of time."
    estructuras: ["A ... is the ... that ...", "It tells the model what ...", "For example, I can write: ...", "If my prompt is clear, ...", "I usually say ..."]
    vocabulario: [{ termino: "prompt", traduccion: "prompt, instrucción o texto de entrada al modelo" }, { termino: "model", traduccion: "modelo" }, { termino: "result", traduccion: "resultado" }, { termino: "example", traduccion: "ejemplo" }]
  - id: ent-ia-03
    nivel: A2
    pregunta: "Do you check the code that AI writes for you?"
    respuesta: "Yes, I always check it. AI can write code very fast, but sometimes the code has errors. Last week the tool wrote a function for me, and it did not work with an empty list. I found the problem when I ran the tests. Then I asked the tool to fix it, and I tested the code again. I also read every line to understand it. I do not use code that I do not understand."
    estructuras: ["Yes, I always check it.", "Sometimes the code has ...", "Last week the tool wrote ..., and it did not work with ...", "I found the problem when I ...", "I do not use ... that I do not understand."]
