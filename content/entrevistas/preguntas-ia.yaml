  - id: ent-ia-05
    nivel: B1
    pregunta: "What is a hallucination in a language model, and how do you deal with it?"
    respuesta: "A hallucination is when a model gives an answer that sounds confident but is false. For example, once an assistant suggested a function from a library, and that function did not exist. I lost twenty minutes before I noticed it. Since then, I verify important answers in the official documentation, and I run the code instead of trusting it. When I can, I also paste the relevant part of the documentation into the prompt, because this makes invented answers less likely. Models are useful, but they are not a source of truth."
    estructuras: ["A ... is when a model ...", "For example, once ... suggested ...", "Since then, I ...", "I ... instead of trusting it.", "..., because this makes ... less likely."]
