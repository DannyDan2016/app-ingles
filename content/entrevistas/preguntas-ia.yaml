  - id: ent-ia-06
    nivel: B1
    pregunta: "How do you write a good prompt for a coding task?"
    respuesta: "I try to give the model enough context. First, I describe the goal and the technology, for example a REST endpoint in Node.js. Then I add the constraints, such as the format of the response and the error cases. When the task is complex, I include a short example of the expected input and output. If the first answer is not what I wanted, I do not start again; I explain what is wrong and ask for a change. This is faster than writing one huge prompt, and the results are usually better."
    estructuras: ["I try to give the model enough ...", "First, I describe ... Then I add ...", "When the task is complex, I include ...", "If the first answer is not what I wanted, I ...", "This is faster than ..."]
