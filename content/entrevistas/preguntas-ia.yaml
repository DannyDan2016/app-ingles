  - id: ent-ia-04
    nivel: A2
    pregunta: "What can go wrong when you use AI to write code?"
    respuesta: "Many things can go wrong. First, the AI can give an answer that looks correct, but it is wrong. Second, it can use old libraries that are not safe now. Third, if I put private data in my prompt, the data goes to an external service. For this reason, I never send passwords or customer data to an AI tool. I also run the tests, and I ask a colleague to review the code. These small steps help me avoid big problems."
    estructuras: ["Many things can go wrong.", "First, ... Second, ... Third, ...", "It looks correct, but it is wrong.", "For this reason, I never ...", "These small steps help me avoid ..."]
