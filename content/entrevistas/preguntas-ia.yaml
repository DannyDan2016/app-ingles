  - id: ent-ia-11
    nivel: B2
    pregunta: "When would you choose a smaller model over a larger one?"
    respuesta: "It depends on the task, the budget and the latency we can accept. If the task is simple and happens thousands of times, like classifying support tickets, a smaller model is usually enough, and it is cheaper and faster. A larger model makes sense when the task requires complex reasoning or has to follow long, detailed instructions. In a previous project, we had been using a large model for everything, until we noticed that costs were growing quickly. After we had evaluated a smaller one on a sample of real tickets, we found that the quality was almost the same, so we switched and sent only the difficult cases to the large model. I would always decide with measurements, not with assumptions."
    estructuras: ["It depends on ..., ... and ...", "If the task is ..., a smaller model is usually enough.", "... makes sense when the task requires ...", "We had been using ..., until we noticed that ...", "I would always decide with ..., not with ..."]
