  - id: ent-ia-08
    nivel: B1
    pregunta: "What is RAG, and why do teams use it?"
    respuesta: "RAG means retrieval-augmented generation. Before the model answers, the system searches our own documents and adds the most relevant parts to the prompt. Teams use it because a model does not know private or recent information. For example, in my last project we built a support assistant that answered questions from our internal wiki. Compared with fine-tuning, RAG was cheaper and easier to update, because we only had to change the documents. The answers also had links to the sources, so users could check them."
    estructuras: ["... means ...", "Before the model answers, the system ...", "Teams use it because ...", "Compared with ..., it was cheaper and easier to ...", "..., so users could ..."]
