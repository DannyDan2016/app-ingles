preguntas:
  - id: ent-ia-01
    nivel: A2
    pregunta: "What AI tools do you use when you write code?"
    respuesta: "I use an AI assistant in my code editor every day. It suggests code while I type, and it helps me with small tasks. For example, yesterday I asked it to write a function to sort a list of users. It gave me a good answer in a few seconds. I also use a chat tool to ask questions about errors. I always read the code before I use it. The tool is fast, but it is not perfect. I am still the person who is responsible for the final code."
