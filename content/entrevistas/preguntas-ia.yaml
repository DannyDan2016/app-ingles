  - id: ent-ia-09
    nivel: B2
    pregunta: "How would you evaluate an LLM-based feature before releasing it?"
    respuesta: "I would start by defining what a good answer means for our users. Then I would build a test set of real questions, including difficult and unusual ones, and score the outputs with clear criteria, such as accuracy, tone and safety. Automatic checks are cheap, but they can be misleading, so I would combine them with a human review of a sample. If the results were below our target, I would not release the feature; instead, I would improve the prompt or the data and measure again. After launch, I would monitor feedback and failures, and I would run the test set again whenever the prompt changed or the model was updated, since behavior can change without warning."
    estructuras: ["I would start by defining ...", "..., such as ... and ...", "..., but they can be misleading, so I would ...", "If the results were below ..., I would not ...", "I would run ... again whenever ..., since ... can change without warning."]
