  - id: ent-ia-07
    nivel: B1
    pregunta: "How can AI help you with testing and code review?"
    respuesta: "I use AI as a second pair of eyes. For testing, I ask it to suggest edge cases that I did not think about, like empty lists or very long names. Then I write the tests myself or I adapt the generated ones. For code review, I paste a small function and ask for possible bugs or unclear names. Last month it found a missing null check, which saved us from a production error. However, I never accept its comments without thinking, because it sometimes misses the business context."
    estructuras: ["I use AI as ...", "For testing, I ask it to ...", "Last month it found ..., which saved us from ...", "However, I never accept ... without thinking.", "..., because it sometimes misses ..."]
