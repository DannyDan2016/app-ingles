  - id: ent-ia-10
    nivel: B2
    pregunta: "How do you protect sensitive data when you use AI tools at work?"
    respuesta: "My rule is that confidential information should never be sent to a tool that the company has not approved. Before using a new assistant, I would check where the data is stored and whether it is used to train models. In practice, I remove secrets, customer details and internal URLs from my prompts, and I use anonymized examples instead. If a task really needs private data, it should be handled by an approved service or a self-hosted model. I also think that teams need clear guidelines, because people make mistakes when the rules are vague."
