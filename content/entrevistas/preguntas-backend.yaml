  - id: ent-backend-07
    nivel: B1
    pregunta: "What is the difference between authentication and authorization?"
    respuesta: "Authentication answers the question \"Who are you?\", and authorization answers \"What are you allowed to do?\". For example, when a user logs in with a password, we authenticate them. After that, when they try to delete an invoice, we check whether their role has permission. If they are not logged in, we return 401, and if they do not have permission, we return 403. In my last project, I implemented login with tokens that expire after a short time. I also stored passwords with a slow hashing algorithm made for passwords, like bcrypt, never as plain text. A common mistake is to check the permissions only in the frontend, so I always repeat the checks on the server."
