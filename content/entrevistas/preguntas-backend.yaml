  - id: ent-backend-08
    nivel: B1
    pregunta: "How do you handle errors and logging in a backend service?"
    respuesta: "I think errors should be handled in one central place, so every endpoint returns the same format. The user receives a simple message, but the log keeps the technical details, like the stack trace and a request id. That id is very useful, because we can follow one request through several services. I use log levels, such as info, warning and error, so I can filter the noise. Also, I never write passwords or personal data in the logs. Once, good logs helped us find a payment bug in ten minutes instead of two hours."
