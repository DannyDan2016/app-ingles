  - id: ent-backend-10
    nivel: B2
    pregunta: "How would you choose between a relational database and a NoSQL database?"
    respuesta: "I would look at the shape of the data and how it will be used. If the data has clear relationships and we need transactions, like orders, payments and customers, a relational database is usually the safest option. A document database could be better when the schema changes often, or when we always read a whole object at once. That said, I would not choose a technology only because it is fashionable. In one project, we started with a document database, and we later regretted it, because the reports needed many joins. Now I would prototype the main queries before deciding."
    estructuras: ["I would look at ... and how it will be used.", "If ..., a relational database is usually the safest option.", "... could be better when ..., or when ...", "That said, I would not choose ... only because ...", "..., and we later regretted it, because ..."]
