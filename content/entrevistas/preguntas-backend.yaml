  - id: ent-backend-04
    nivel: A2
    pregunta: "What do you do when the server returns an error?"
    respuesta: "First, I look at the status code. A 400 error means the request is wrong. A 500 error means there is a problem in the server. Then I open the logs and look for the error message. Last week, an endpoint returned 500 because a field was empty. I found the line in the log, and I changed the code. Now the endpoint checks the data and returns a 400 error with a clear message. After that, I wrote a test, so the same error does not happen again. I also tell my team what happened."
    estructuras: ["First, I look at ...", "A ... error means ...", "Then I open the logs and look for ...", "Last week, ... returned ... because ...", "I wrote a test, so the same error does not happen again."]
