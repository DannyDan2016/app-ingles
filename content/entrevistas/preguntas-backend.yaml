  - id: ent-backend-06
    nivel: B1
    pregunta: "What is a database index, and when is it a good idea to create one?"
    respuesta: "An index is a structure that helps the database find rows faster, like the index of a book. Without an index, the database must read the whole table, which is slow when the table is large. I create an index on columns that we use often in filters or joins, for example the email of a user. However, indexes are not free, because they take space and make writes slower. In a previous project, a report took twenty seconds. I checked the query plan, added one index, and the time dropped to less than a second."
    estructuras: ["... is a structure that helps ... find ... faster", "Without ..., the database must ...", "I create ... on ... that we use often in ...", "However, ... are not free, because ...", "I checked ..., added ..., and the time dropped to ..."]
