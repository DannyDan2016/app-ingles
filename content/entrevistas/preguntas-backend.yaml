  - id: ent-backend-09
    nivel: B2
    pregunta: "An endpoint has become very slow. How would you investigate and fix it?"
    respuesta: "I would start by measuring, not guessing. With a profiler or tracing tool, I would see where the time is spent: in the database, in an external call, or in the code. A very common cause is the N+1 problem, where the code runs one query per item instead of loading everything at once. If that were the case, I would fix it with a join or a batch query. For data that rarely changes, a cache could help, but it should have a clear expiry. After deploying the change, I would compare the response times, because an optimization that is not measured is only an opinion."
    estructuras: ["I would start by measuring, not guessing.", "A very common cause is ..., where ...", "If that were the case, I would fix it with ...", "..., but it should have ...", "..., because an optimization that is not measured is only ..."]
