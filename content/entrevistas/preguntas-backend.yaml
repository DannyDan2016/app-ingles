preguntas:
  - id: ent-backend-01
    nivel: A2
    pregunta: "What is an API?"
    respuesta: "An API is a way for two programs to talk to each other. For example, a mobile app asks the server for a list of products. The server sends the data back in a simple format, usually JSON. I build APIs with Node.js. Each API has endpoints, and each endpoint does one job. One endpoint gets users, and another one creates a new user. A good API is simple, clear and secure."
