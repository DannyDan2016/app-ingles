    vocabulario: [{ termino: "API", traduccion: "interfaz de programación de aplicaciones" }, { termino: "endpoint", traduccion: "punto de acceso de una API" }, { termino: "server", traduccion: "servidor" }, { termino: "JSON", traduccion: "JSON, formato de texto ligero para intercambiar datos (pares clave-valor)" }, { termino: "secure", traduccion: "seguro (protegido contra ataques)" }]
  - id: ent-backend-02
    nivel: A2
    pregunta: "What is the difference between GET and POST?"
    respuesta: "GET is used to read data. For example, I use GET to see the list of orders. It does not change anything on the server, and the data goes in the URL. POST is used to send new data. For example, I use POST when a user creates an order. The data goes in the body of the request. We should not use GET to change data, because browsers and other tools can repeat a GET request at any time. I use the right method for each task, so the API is easy to understand."
    estructuras: ["... is used to read data.", "For example, I use ... to ...", "It does not change anything on ...", "We should not use ... to ..., because ...", "I use the right ... for each task, so ..."]
    vocabulario: [{ termino: "request", traduccion: "petición" }, { termino: "body", traduccion: "cuerpo (de la petición)" }, { termino: "order", traduccion: "pedido" }, { termino: "method", traduccion: "método" }]
  - id: ent-backend-03
    nivel: A2
    pregunta: "What is a database, and which ones do you know?"
    respuesta: "A database is a place where an application keeps its data. Users, orders and products are in the database. I know PostgreSQL and MySQL. They are relational databases, so the data is in tables. I also know a little MongoDB, which saves data as documents. I use SQL to read and change the data. For example, I write a query to find all the orders from last week. We also have a backup every day, because a copy of the data is very important."
    estructuras: ["A ... is a place where ...", "I know ... and ...", "They are ..., so the data is in ...", "For example, I write a query to ...", "We also ..., because ... is very important."]
