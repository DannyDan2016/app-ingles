  - id: ent-backend-11
    nivel: B2
    pregunta: "How do you make sure a payment endpoint is safe to retry?"
    respuesta: "The key idea is idempotency. If a client sends the same request twice, for example after a network timeout, the customer must be charged only once. To achieve this, the client generates a unique idempotency key and sends the same key with every retry. Before processing, the server saves the key under a unique constraint, so a second request with that key cannot start a parallel payment. When the payment finishes, the result is stored with the key, and if the key arrives again, the saved response is returned instead of charging the customer again. Keys would normally expire after a reasonable period, such as 24 hours. Finally, I would add tests that send duplicated and concurrent requests."
    estructuras: ["The key idea is ...", "If a client sends ... twice, ... must be ... only once.", "To achieve this, the client ... and sends ...", "..., so a second request ... cannot ...", "..., the saved response is returned instead of ..."]
    vocabulario: [{ termino: "idempotency", traduccion: "idempotencia (repetir la operación da el mismo resultado)" }, { termino: "timeout", traduccion: "tiempo de espera agotado" }, { termino: "retry", traduccion: "reintento" }, { termino: "unique constraint", traduccion: "restricción de unicidad" }, { termino: "concurrent requests", traduccion: "peticiones simultáneas" }, { termino: "charge", traduccion: "cobrar" }]
  - id: ent-backend-12
    nivel: B2
    pregunta: "How would you change a database schema in production without downtime?"
    respuesta: "I would split the change into small, backward-compatible steps, which is often called the expand and contract pattern. For example, if we wanted to rename a column, we would first add the new column and deploy code that writes to both. Then we would copy the old data in batches, so that we do not lock the table for a long time. Only after the application had been switched to read the new column would we remove the old one. Each step should allow a safe rollback, and it should be tested on a realistic copy of the data first, with personal data anonymized. This takes longer than one big migration, but it avoids surprises during the deployment."
