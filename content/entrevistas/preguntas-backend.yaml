  - id: ent-backend-05
    nivel: B1
    pregunta: "What makes a REST API well designed?"
    respuesta: "For me, a good REST API is predictable. The URLs use nouns, like /orders and /orders/42, and the HTTP methods show the action: GET to read, POST to create, PUT or PATCH to update, and DELETE to remove. The API should return the correct status codes, for instance 404 when something does not exist, and clear error messages. In my last project, we also added pagination to every list endpoint, because one request returned ten thousand records and the server became slow. Finally, I think versioning is important, so we can change the API without breaking existing clients."
