tipo: glosario
nivel: B2
tema: frontend
entradas:
  - { termino: hydration, categoria: noun, traduccion_es: "hidratación (el JS se conecta al HTML del servidor)", definicion_en: "The step in which JavaScript attaches to HTML that was already rendered on the server.", ejemplo_en: "The page is visible but not interactive until hydration finishes.", nivel: B2, tema: frontend }
  - { termino: server-side rendering, categoria: noun, traduccion_es: "renderizado en servidor", definicion_en: "Generating the HTML of a page on the server for each request.", ejemplo_en: "Server-side rendering shows the content immediately.", nivel: B2, tema: frontend }
  - { termino: memoization, categoria: noun, traduccion_es: memoización, definicion_en: "Saving the result of a calculation to avoid repeating it with the same input.", ejemplo_en: "Memoization avoids expensive calculations in the components.", nivel: B2, tema: frontend }
  - { termino: tree shaking, categoria: noun, traduccion_es: "eliminación de código no usado (tree shaking)", definicion_en: "Removing the code that is never used from the final bundle.", ejemplo_en: "Tree shaking makes the bundle smaller.", nivel: B2, tema: frontend }
  - { termino: code splitting, categoria: noun, traduccion_es: "división del código", definicion_en: "Dividing the JavaScript bundle into smaller parts that load only when needed.", ejemplo_en: "Code splitting reduced the main bundle by 40 percent.", nivel: B2, tema: frontend }
  - { termino: layout shift, categoria: noun, traduccion_es: "desplazamiento de maquetación", definicion_en: "A sudden movement of the elements of a page while it is loading.", ejemplo_en: "Reserve space for images to avoid a layout shift.", nivel: B2, tema: frontend }
  - { termino: semantic html, categoria: noun, traduccion_es: "HTML semántico", definicion_en: "HTML that uses the right element for each purpose, such as button, nav or main.", ejemplo_en: "Semantic HTML makes the page usable for everyone.", nivel: B2, tema: frontend }
  - { termino: aria, categoria: noun, traduccion_es: "ARIA (atributos de accesibilidad)", definicion_en: "A set of HTML attributes that give extra meaning to assistive technologies.", ejemplo_en: "Use aria attributes only when no native element exists.", nivel: B2, tema: frontend }
  - { termino: screen reader, categoria: noun, traduccion_es: "lector de pantalla", definicion_en: "A program that reads the content of the screen aloud for people who cannot see it.", ejemplo_en: "A screen reader announces each element of the page.", nivel: B2, tema: frontend }
  - { termino: contrast ratio, categoria: noun, traduccion_es: "relación de contraste", definicion_en: "A number that measures how different a text color is from its background.", ejemplo_en: "The contrast ratio of the text must be at least 4.5 to 1.", nivel: B2, tema: frontend }
  - { termino: focus, categoria: noun, traduccion_es: "foco (elemento activo del teclado)", definicion_en: "The element of the page that currently receives the keyboard input.", ejemplo_en: "A real button receives focus by default.", nivel: B2, tema: frontend }
  - { termino: progressive enhancement, categoria: noun, traduccion_es: "mejora progresiva", definicion_en: "Building a basic page that works everywhere and then adding advanced features.", ejemplo_en: "Progressive enhancement keeps the page usable without JavaScript.", nivel: B2, tema: frontend }
  - { termino: render-blocking, categoria: adjective, traduccion_es: "que bloquea el renderizado", definicion_en: "Describes a resource that stops the browser from showing the page until it is loaded.", ejemplo_en: "A render-blocking script in the head delays the first paint.", nivel: B2, tema: frontend }
  - { termino: pull request, categoria: noun, traduccion_es: "pull request (solicitud de integración de cambios)", definicion_en: "A request to review and merge a set of code changes into the main branch.", ejemplo_en: "This pull request migrates the Button component.", nivel: B2, tema: frontend }
  - { termino: code review, categoria: noun, traduccion_es: "revisión de código", definicion_en: "The process in which other developers check the changes before they are merged.", ejemplo_en: "I have finished the code review and the changes look good.", nivel: B2, tema: frontend }
  - { termino: merge conflict, categoria: noun, traduccion_es: "conflicto de fusión", definicion_en: "A situation in which Git cannot combine two changes to the same part of a file.", ejemplo_en: "I resolved a merge conflict in the checkout package.", nivel: B2, tema: frontend }
  - { termino: breaking change, categoria: noun, traduccion_es: "cambio incompatible (breaking change)", definicion_en: "A change that forces the users of an API or a component to update their code.", ejemplo_en: "The removal of the old API is a breaking change.", nivel: B2, tema: frontend }
  - { termino: backward compatible, categoria: adjective, traduccion_es: "compatible con versiones anteriores", definicion_en: "Able to work with older versions of a system without changes.", ejemplo_en: "The new version is not backward compatible with the old prop.", nivel: B2, tema: frontend }
  - { termino: monorepo, categoria: noun, traduccion_es: monorepo, definicion_en: "A single repository that contains the code of several applications or packages.", ejemplo_en: "All our front-end applications live in the monorepo.", nivel: B2, tema: frontend }
  - { termino: design system, categoria: noun, traduccion_es: "sistema de diseño", definicion_en: "A shared set of components, rules and styles for building consistent interfaces.", ejemplo_en: "The Button component now belongs to the design system.", nivel: B2, tema: frontend }
  - { termino: tech debt, categoria: noun, traduccion_es: "deuda técnica", definicion_en: "The future cost of quick or old solutions that make the code harder to change.", ejemplo_en: "The migration reduces our tech debt.", nivel: B2, tema: frontend }
  - { termino: linter, categoria: noun, traduccion_es: "linter (analizador de estilo y errores)", definicion_en: "A tool that checks the code for style problems and possible errors.", ejemplo_en: "The linter runs in CI and reports no warnings.", nivel: B2, tema: frontend }
  - { termino: type safety, categoria: noun, traduccion_es: "seguridad de tipos", definicion_en: "The protection against using a value as the wrong type of data.", ejemplo_en: "The component now has complete type safety.", nivel: B2, tema: frontend }
  - { termino: polyfill, categoria: noun, traduccion_es: "polyfill (código que añade funciones a navegadores antiguos)", definicion_en: "Code that adds a modern feature to a browser that does not support it.", ejemplo_en: "We deleted the old polyfill for a browser that nobody uses.", nivel: B2, tema: frontend }
  - { termino: state management, categoria: noun, traduccion_es: "gestión del estado", definicion_en: "The way an application stores and updates the data that changes over time.", ejemplo_en: "A local loading state makes the state management simpler.", nivel: B2, tema: frontend }
  - { termino: changelog, categoria: noun, traduccion_es: "registro de cambios (changelog)", definicion_en: "A file that lists the changes of each version of a project.", ejemplo_en: "The changelog mentions the breaking change.", nivel: B2, tema: frontend }
