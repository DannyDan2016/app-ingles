tipo: glosario
nivel: B2
tema: ia
entradas:
  - { termino: overfitting, categoria: noun, traduccion_es: "sobreajuste (el modelo memoriza los datos de entrenamiento)", definicion_en: "A problem in which a model works very well on its training data but badly on new data.", ejemplo_en: "Overfitting made the assistant fail with real customers.", nivel: B2, tema: ia }
  - { termino: inference, categoria: noun, traduccion_es: "inferencia (uso del modelo ya entrenado)", definicion_en: "The moment when a trained model receives an input and produces an answer.", ejemplo_en: "Inference is slower when the prompt is very long.", nivel: B2, tema: ia }
  - { termino: benchmark, categoria: noun, traduccion_es: "prueba de referencia (benchmark)", definicion_en: "A standard test used to compare the quality or speed of different models.", ejemplo_en: "The model scored very well on the internal benchmark.", nivel: B2, tema: ia }
  - { termino: embedding, categoria: noun, traduccion_es: "embedding (representación numérica de un texto)", definicion_en: "A list of numbers that represents the meaning of a word, a sentence or a document.", ejemplo_en: "We compare the embedding of the question with the embeddings of the documents.", nivel: B2, tema: ia }
  - { termino: guardrail, categoria: noun, traduccion_es: "barrera de seguridad (guardrail)", definicion_en: "A rule or filter that limits what an AI system can say or do.", ejemplo_en: "A guardrail blocks any answer that has no source.", nivel: B2, tema: ia }
  - { termino: fine-tuning, categoria: noun, traduccion_es: "ajuste fino", definicion_en: "Extra training of an existing model with specific data for a particular task.", ejemplo_en: "Fine-tuning helped the model to use our company vocabulary.", nivel: B2, tema: ia }
  - { termino: retrieval, categoria: noun, traduccion_es: "recuperación (de documentos para el modelo)", definicion_en: "The step in which a system searches for relevant documents before the model answers.", ejemplo_en: "The retrieval step returned an outdated policy page.", nivel: B2, tema: ia }
  - { termino: evaluation, categoria: noun, traduccion_es: evaluación, definicion_en: "A systematic test of how well a model or system performs.", ejemplo_en: "We ran a careful evaluation with fresh data before the launch.", nivel: B2, tema: ia }
  - { termino: robust, categoria: adjective, traduccion_es: "robusto (que resiste entradas difíciles)", definicion_en: "Strong enough to keep working well in difficult or unexpected situations.", ejemplo_en: "A robust system says that it does not know instead of guessing.", nivel: B2, tema: ia }
  - { termino: drift, categoria: noun, traduccion_es: "deriva (cambio de los datos con el tiempo)", definicion_en: "A gradual change in real data that makes a model less accurate over time.", ejemplo_en: "We should have monitored the drift every week.", nivel: B2, tema: ia }
  - { termino: prompt injection, categoria: noun, traduccion_es: "inyección de instrucciones (prompt injection)", definicion_en: "An attack in which a user hides new instructions in the input to change the behavior of a model.", ejemplo_en: "A prompt injection made the chatbot ignore its rules.", nivel: B2, tema: ia }
  - { termino: agent, categoria: noun, traduccion_es: "agente (IA que realiza acciones por su cuenta)", definicion_en: "An AI system that can plan steps and use tools to complete a task.", ejemplo_en: "The agent can search the database and create a refund.", nivel: B2, tema: ia }
  - { termino: context window, categoria: noun, traduccion_es: "ventana de contexto", definicion_en: "The maximum amount of text that a model can read at the same time.", ejemplo_en: "The context window was large enough to hold the whole policy.", nivel: B2, tema: ia }
  - { termino: hype, categoria: noun, traduccion_es: "expectación exagerada", definicion_en: "Excessive publicity and excitement about a new technology.", ejemplo_en: "Behind the hype, the tool is useful only for routine tasks.", nivel: B2, tema: ia }
  - { termino: trade-off, categoria: noun, traduccion_es: "compromiso (ganar algo a cambio de perder otra cosa)", definicion_en: "A situation in which you accept less of one good thing to get more of another.", ejemplo_en: "There is a trade-off between speed and careful review.", nivel: B2, tema: ia }
  - { termino: governance, categoria: noun, traduccion_es: gobernanza, definicion_en: "The rules, roles and processes that control how a technology is used in an organization.", ejemplo_en: "Good governance means that someone is responsible for every model.", nivel: B2, tema: ia }
  - { termino: transparency, categoria: noun, traduccion_es: transparencia, definicion_en: "The quality of being open about how a system works and how decisions are made.", ejemplo_en: "Transparency helps us in audits.", nivel: B2, tema: ia }
  - { termino: accountable, categoria: adjective, traduccion_es: "responsable (que debe rendir cuentas)", definicion_en: "Required to explain and take responsibility for what happens.", ejemplo_en: "Someone must be accountable for the results of the model.", nivel: B2, tema: ia }
  - { termino: compliance, categoria: noun, traduccion_es: "cumplimiento normativo", definicion_en: "Following the laws, rules and standards that apply to your work.", ejemplo_en: "Compliance with data protection rules is mandatory.", nivel: B2, tema: ia }
  - { termino: mitigate, categoria: verb, traduccion_es: mitigar, definicion_en: "To make a risk or a problem less serious.", ejemplo_en: "We can mitigate the risk by avoiding sensitive data in prompts.", nivel: B2, tema: ia }
  - { termino: deterministic, categoria: adjective, traduccion_es: determinista, definicion_en: "Always producing the same result from the same input.", ejemplo_en: "A traditional script is deterministic, but a language model is not.", nivel: B2, tema: ia }
  - { termino: scalable, categoria: adjective, traduccion_es: escalable, definicion_en: "Able to grow and handle more work without major changes.", ejemplo_en: "The solution must be scalable to every team.", nivel: B2, tema: ia }
  - { termino: adoption, categoria: noun, traduccion_es: adopción, definicion_en: "The decision to start using something new, such as a tool or a method.", ejemplo_en: "The adoption of AI assistants needs a clear plan.", nivel: B2, tema: ia }
  - { termino: limitation, categoria: noun, traduccion_es: limitación, definicion_en: "A weakness or a restriction that stops something from being perfect.", ejemplo_en: "The main limitation is that the answers are not always reliable.", nivel: B2, tema: ia }
  - { termino: ethical, categoria: adjective, traduccion_es: ético, definicion_en: "Connected with what is morally right or wrong.", ejemplo_en: "We must think about the ethical use of customer data.", nivel: B2, tema: ia }
  - { termino: oversight, categoria: noun, traduccion_es: "supervisión", definicion_en: "The act of watching and checking that something is done correctly.", ejemplo_en: "Human oversight is required before a suggestion is merged.", nivel: B2, tema: ia }
