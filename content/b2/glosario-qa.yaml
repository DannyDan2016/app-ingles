tipo: glosario
nivel: B2
tema: qa
entradas:
  - { termino: postmortem, categoria: noun, traduccion_es: "análisis posterior a un incidente (postmortem)", definicion_en: "A review done after an incident to understand what happened and how to improve.", ejemplo_en: "The postmortem found three gaps in our process.", nivel: B2, tema: qa }
  - { termino: incident, categoria: noun, traduccion_es: incidente, definicion_en: "An unplanned event that affects the quality or the availability of a service.", ejemplo_en: "The incident lasted ninety minutes.", nivel: B2, tema: qa }
  - { termino: hotfix, categoria: noun, traduccion_es: "corrección urgente (hotfix)", definicion_en: "A fast fix applied to production to solve an urgent problem.", ejemplo_en: "We applied a hotfix at 15:40.", nivel: B2, tema: qa }
  - { termino: rollback, categoria: noun, traduccion_es: "vuelta a la versión anterior (rollback)", definicion_en: "The action of returning a system to its previous working version.", ejemplo_en: "The on-call engineer decided to perform a rollback.", nivel: B2, tema: qa }
  - { termino: edge case, categoria: noun, traduccion_es: "caso límite", definicion_en: "An unusual situation that happens only at the limits of normal use.", ejemplo_en: "Nobody tested the edge case of two simultaneous payments.", nivel: B2, tema: qa }
  - { termino: race condition, categoria: noun, traduccion_es: "condición de carrera", definicion_en: "A bug that appears when the result depends on the timing of two or more processes.", ejemplo_en: "A race condition charged some customers twice.", nivel: B2, tema: qa }
  - { termino: exploratory testing, categoria: noun, traduccion_es: "pruebas exploratorias", definicion_en: "Testing in which the tester learns the product and designs tests at the same time, without a fixed script.", ejemplo_en: "Exploratory testing helps to find unexpected problems.", nivel: B2, tema: qa }
  - { termino: acceptance criteria, categoria: noun, traduccion_es: "criterios de aceptación", definicion_en: "The conditions that a feature must meet to be accepted by the team or the client.", ejemplo_en: "The acceptance criteria did not include concurrency.", nivel: B2, tema: qa }
  - { termino: stakeholder, categoria: noun, traduccion_es: "parte interesada", definicion_en: "A person or group that is affected by a project or has an interest in it.", ejemplo_en: "We informed the stakeholders in finance and support.", nivel: B2, tema: qa }
  - { termino: sign-off, categoria: noun, traduccion_es: "aprobación formal", definicion_en: "Formal approval that a product or a release is ready.", ejemplo_en: "The sign-off was given by one person under time pressure.", nivel: B2, tema: qa }
  - { termino: traceability, categoria: noun, traduccion_es: trazabilidad, definicion_en: "The ability to follow the link between requirements, tests and results.", ejemplo_en: "Weak traceability hid the missing test.", nivel: B2, tema: qa }
  - { termino: risk, categoria: noun, traduccion_es: riesgo, definicion_en: "The possibility that something bad will happen and its possible impact.", ejemplo_en: "The risk of a payment change is high.", nivel: B2, tema: qa }
  - { termino: blameless, categoria: adjective, traduccion_es: "sin culpables", definicion_en: "Focused on improving the process instead of blaming people.", ejemplo_en: "We use a blameless format for every postmortem.", nivel: B2, tema: qa }
  - { termino: test strategy, categoria: noun, traduccion_es: "estrategia de pruebas", definicion_en: "A high-level plan that explains what, when and how a team tests.", ejemplo_en: "The current test strategy was too slow.", nivel: B2, tema: qa }
  - { termino: shift left, categoria: phrase, traduccion_es: "mover las pruebas antes en el proceso", definicion_en: "To start testing activities earlier in the development process.", ejemplo_en: "With shift left, testers review user stories before coding starts.", nivel: B2, tema: qa }
  - { termino: test pyramid, categoria: noun, traduccion_es: "pirámide de pruebas", definicion_en: "A model that recommends many fast unit tests, fewer integration tests and very few end-to-end tests.", ejemplo_en: "The test pyramid helped us to rebalance our suite.", nivel: B2, tema: qa }
  - { termino: end-to-end test, categoria: noun, traduccion_es: "prueba de extremo a extremo", definicion_en: "A test that checks a complete user flow through the whole system.", ejemplo_en: "An end-to-end test covers the login, the cart and the payment.", nivel: B2, tema: qa }
  - { termino: contract test, categoria: noun, traduccion_es: "prueba de contrato", definicion_en: "A test that checks that two services agree on the format of their messages.", ejemplo_en: "A contract test warns us when the API response changes.", nivel: B2, tema: qa }
  - { termino: test data, categoria: noun, traduccion_es: "datos de prueba", definicion_en: "The data that tests use as input or as a starting state.", ejemplo_en: "Unreliable test data makes the tests fail randomly.", nivel: B2, tema: qa }
  - { termino: fixture, categoria: noun, traduccion_es: "fixture (datos o estado fijo de partida)", definicion_en: "A fixed set of data or conditions that prepares the same starting point for every test.", ejemplo_en: "A shared fixture creates the same records every time.", nivel: B2, tema: qa }
  - { termino: parallelize, categoria: verb, traduccion_es: paralelizar, definicion_en: "To run several tasks at the same time instead of one after another.", ejemplo_en: "We want to parallelize the suite to save time.", nivel: B2, tema: qa }
  - { termino: coverage gap, categoria: noun, traduccion_es: "hueco de cobertura", definicion_en: "A part of the code or the behaviour that is not tested enough.", ejemplo_en: "Lena found a coverage gap in the discount module.", nivel: B2, tema: qa }
  - { termino: mutation testing, categoria: noun, traduccion_es: "pruebas de mutación", definicion_en: "A technique that makes small changes to the code to check whether the tests detect them.", ejemplo_en: "Mutation testing shows that high coverage can hide weak tests.", nivel: B2, tema: qa }
  - { termino: quality gate, categoria: noun, traduccion_es: "puerta de calidad", definicion_en: "A minimum condition that a build must meet before it can move to the next stage.", ejemplo_en: "A failed smoke test closes the quality gate.", nivel: B2, tema: qa }
  - { termino: smoke test, categoria: noun, traduccion_es: "prueba de humo", definicion_en: "A quick check that the most basic functions of a build work.", ejemplo_en: "Run the smoke test before any longer suite.", nivel: B2, tema: qa }
  - { termino: non-functional, categoria: adjective, traduccion_es: "no funcional (rendimiento, seguridad, usabilidad)", definicion_en: "Related to how a system works, such as speed or security, and not to what it does.", ejemplo_en: "Non-functional checks include response time.", nivel: B2, tema: qa }
