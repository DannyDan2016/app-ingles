tipo: leccion
id: b2-ia-01
nivel: B2
tema: ia
orden: 1
titulo: The Model Might Have Been Biased
objetivo: Puedo analizar en un postmortem por qué un modelo falló, expresando grados de certeza sobre causas pasadas.
gramatica: "Modales de deducción en pasado (The model must have overfitted; The benchmark can't have been the problem; A customer might have used a prompt injection) y crítica con should have (We should have checked the drift)"
lectura: |
  The support assistant had been live for three weeks when customers began to complain. It was giving confident but incorrect answers about refund rules, and nobody could explain why. On Thursday, the AI team met to find out what had gone wrong.

  "The model must have [[overfitted|overfitting]] during [[fine-tuning]]," said Carla, the machine learning engineer. "It scored very well on our internal [[benchmark]], but a high score on a fixed test set proves little." Tomás disagreed. "The benchmark can't have been the real problem. We ran a careful [[evaluation]] with fresh data before the launch." "Then we should have tested it with messier questions," Carla replied. "Our users don't write like our test set."

  The team then examined the [[retrieval]] step. The assistant finds policy pages by comparing the [[embedding]] of each question with the embeddings of the documents. "Someone might have changed the refund policy without re-indexing the pages," Tomás said, "so the system may have retrieved an outdated one. And the data might have [[drifted|drift]] since we trained the model." Carla nodded. "We should have monitored the drift every week."

  They also reviewed the way the model behaves at [[inference]] time. Some answers ignored the retrieved text completely, even though the [[context window]] was large enough to hold it. "A more [[robust]] system would have said 'I don't know'," Tomás added. "We should have added a [[guardrail]] that blocks any answer without a source."

  Finally, Sofía, the security engineer, raised a worrying point. One customer might have used a [[prompt injection]] to change the rules, and the [[agent]] that handles refunds shouldn't have had permission to approve payments on its own.
terminos: [overfitting, inference, benchmark, embedding, guardrail, fine-tuning, retrieval, evaluation, robust, drift, prompt injection, agent, context window]
ejercicios:
  - { id: b2-ia-01-e1, tipo: opcion_multiple, enunciado: "The assistant scored very well on the benchmark but failed with real users, so the model ___ overfitted.", opciones: ["must have", "can't have", "should have"], correcta: 0, explicacion: "«Must have + participio» expresa una deducción casi segura sobre el pasado, basada en la evidencia (buena nota en el benchmark, mal resultado real). «Can't have» diría que es imposible y «should have» es una crítica, no una deducción.", terminos: [overfitting, benchmark] }
  - { id: b2-ia-01-e2, tipo: completar, enunciado: "Completa con el modal de deducción negativa (estás casi seguro de que no ocurrió).", texto: "The team used fresh data, so the benchmark ___ been the real problem.", respuesta: "can't have", aceptadas: ["cannot have", "can’t have", "couldn't have", "could not have"], explicacion: "«Can't have + participio» se usa cuando deduces que algo es casi imposible que ocurriera. Tomás lo usa porque la evaluación con datos nuevos descarta el benchmark como causa principal.", terminos: [benchmark, evaluation] }
  - { id: b2-ia-01-e3, tipo: verdadero_falso, enunciado: "¿Verdadero o falso según la lectura?", afirmacion: "Carla thinks the team should have tested the assistant with messier questions.", correcta: true, explicacion: "Carla dice «we should have tested it with messier questions». «Should have + participio» expresa una crítica o un arrepentimiento: era lo correcto, pero no se hizo." }
  - { id: b2-ia-01-e4, tipo: emparejar, enunciado: "Empareja cada término con su significado.", pares: [{ a: overfitting, b: sobreajuste }, { a: drift, b: deriva de los datos }, { a: guardrail, b: barrera de seguridad }, { a: embedding, b: representación numérica de un texto }], explicacion: "Overfitting es cuando el modelo memoriza los datos de entrenamiento y generaliza mal. Drift es el cambio gradual de los datos reales respecto a los de entrenamiento. Un guardrail limita lo que el sistema puede responder o hacer, y un embedding convierte un texto en un vector para comparar significados.", terminos: [overfitting, drift, guardrail, embedding] }
  - { id: b2-ia-01-e5, tipo: ordenar, enunciado: "Ordena la frase (deducción en pasado).", piezas: ["The", "documents", "must", "have", "changed", "since", "training"], explicacion: "Estructura: sujeto + must have + participio + complemento. El modal lleva siempre «have» (no «has») y el verbo principal va en participio: «changed».", terminos: [drift] }
  - { id: b2-ia-01-e6, tipo: opcion_multiple, enunciado: "Which sentence criticizes something that did not happen in the past?", opciones: ["We should have added a guardrail.", "We must add a guardrail.", "We might add a guardrail."], correcta: 0, explicacion: "«Should have + participio» critica una acción pasada que no se hizo. «Must add» es una obligación presente y «might add» una posibilidad futura.", terminos: [guardrail] }
  - { id: b2-ia-01-e7, tipo: completar, enunciado: "Completa con un modal que exprese posibilidad (no certeza).", texto: "A customer ___ have used a prompt injection, because the answer ignored the system rules.", respuesta: "might", aceptadas: ["may", "could"], explicacion: "Might/may/could + have + participio expresan una posibilidad sobre el pasado (hay pruebas, pero no certeza). Es más débil que «must have», que expresa una deducción casi segura.", terminos: [prompt injection] }
  - { id: b2-ia-01-e8, tipo: verdadero_falso, enunciado: "¿Verdadero o falso según la lectura?", afirmacion: "The team is completely sure that the benchmark caused the failure.", correcta: false, explicacion: "Es al revés: Tomás dice que el benchmark «can't have been the real problem». El texto usa varios modales de deducción porque el equipo aún no tiene certeza de la causa.", terminos: [benchmark] }
