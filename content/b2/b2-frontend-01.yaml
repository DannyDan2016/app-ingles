id: b2-frontend-01
nivel: B2
tema: frontend
orden: 10
titulo: Not Only Is It Fast, It Is Also Accessible
objetivo: Puedo defender en un design review decisiones de rendimiento y accesibilidad con argumentos enfatizados.
gramatica: "Estructuras de énfasis: cleft sentences (What matters most is the first render) e inversión (Not only does it load faster, but it also works with a screen reader; Never use a div for a button)"
lectura: |
  Design review: the new product page

  Nina, the lead developer, presents the new product page to the team. "What matters most is the first render," she says. "We now use [[server-side rendering]], so the browser receives complete HTML immediately. Not only does the page load faster, but it also works better for search engines."

  Tomás asks about the [[hydration]] step. "It is the moment when the JavaScript attaches to the existing HTML," Nina explains. "Until it finishes, the page is visible but not interactive. That is why we use [[code splitting]]: it is the size of the main bundle that slows the hydration down. Never have we sent so little JavaScript to the browser." She adds that [[tree shaking]] removes unused code, and that [[memoization]] avoids repeating expensive calculations in the components. Elena, however, is worried about the [[layout shift]]. "What annoys users is the content that jumps while the images load. Rarely does a page feel professional if the buttons move." They agree to reserve the space for every image. They also want to avoid any [[render-blocking]] script in the head of the document.

  The conversation then moves to accessibility. "It is [[semantic HTML]] that makes the page usable for everyone," says Elena. "Never use a div for a button. Not only does a real button receive [[focus]] by default, but it also works with the keyboard." A user with a [[screen reader]] hears exactly what each element is. She also reminds the team to use [[ARIA|aria]] attributes only when no native element exists, and to check the [[contrast ratio]] of every text color: "Only when the ratio is at least 4.5 to 1 can we say that the text is readable."

  Finally, Nina proposes a [[progressive enhancement]] approach. "What we want is a basic page that works without JavaScript, and then we add the advanced features. Under no circumstances should a user be blocked by a script error."
terminos: [hydration, server-side rendering, memoization, tree shaking, code splitting, layout shift, semantic html, aria, screen reader, contrast ratio, focus, progressive enhancement, render-blocking]
