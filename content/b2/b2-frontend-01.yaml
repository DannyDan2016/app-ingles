  - { id: b2-frontend-01-e1, tipo: opcion_multiple, enunciado: "Not only ___ faster, but it also works with a screen reader.", opciones: ["does the page load", "the page loads", "the page does load"], correcta: 0, explicacion: "Después de «Not only» al principio de la frase se invierten sujeto y auxiliar, igual que en una pregunta: «Not only does the page load...». Es una estructura enfática, típica de un registro formal.", terminos: [screen reader] }
  - { id: b2-frontend-01-e2, tipo: completar, enunciado: "Completa la cleft sentence con el verbo «to be» en presente.", texto: "What matters most ___ the first render.", respuesta: "is", explicacion: "Una cleft sentence con «What» pone el énfasis en lo que viene después de «is»: «What matters most is the first render». Sirve para destacar la idea principal de la frase.", terminos: [server-side rendering] }
  - { id: b2-frontend-01-e3, tipo: verdadero_falso, enunciado: "¿Verdadero o falso según la lectura?", afirmacion: "During hydration, the page is already fully interactive.", correcta: false, explicacion: "Nina explica que, hasta que termina la hidratación, la página es visible pero no interactiva. La hidratación es el momento en que el JavaScript se conecta al HTML que ya envió el servidor.", terminos: [hydration] }
  - { id: b2-frontend-01-e4, tipo: emparejar, enunciado: "Empareja cada término con su significado.", pares: [{ a: hydration, b: hidratación (el JS se conecta al HTML) }, { a: tree shaking, b: eliminación de código no usado }, { a: layout shift, b: desplazamiento inesperado de la maquetación }, { a: contrast ratio, b: relación de contraste entre colores }], explicacion: "La hydration conecta el JavaScript con el HTML del servidor. El tree shaking elimina del bundle el código que nunca se usa. El layout shift es el salto visible de los elementos mientras carga la página, y el contrast ratio mide cuánto se distinguen el texto y el fondo.", terminos: [hydration, tree shaking, layout shift, contrast ratio] }
  - { id: b2-frontend-01-e5, tipo: ordenar, enunciado: "Ordena la frase (inversión con «Never»).", piezas: ["Never", "have", "we", "sent", "so", "little", "JavaScript"], explicacion: "Con un adverbio negativo al inicio («Never») se invierten auxiliar y sujeto: «Never have we sent...», no «Never we have sent...». Ojo: con un imperativo («Never use a div for a button») no hay inversión, porque no hay sujeto.", terminos: [code splitting] }
  - { id: b2-frontend-01-e6, tipo: opcion_multiple, enunciado: "Which sentence puts emphasis on the reason using a cleft sentence?", opciones: ["It is semantic HTML that makes the page usable for everyone.", "Semantic HTML makes the page usable for everyone.", "The page is usable for everyone with semantic HTML."], correcta: 0, explicacion: "«It is + elemento destacado + that...» es otra cleft sentence: pone todo el foco en «semantic HTML». Las otras dos opciones dicen lo mismo sin ningún énfasis especial.", terminos: [semantic html] }
  - { id: b2-frontend-01-e7, tipo: completar, enunciado: "Completa con la palabra que forma la inversión con «Rarely».", texto: "Rarely ___ a page feel professional if the buttons move.", respuesta: "does", explicacion: "Los adverbios negativos o restrictivos (never, rarely, seldom, hardly) al inicio de la frase provocan inversión: «Rarely does a page feel...». Se usa el auxiliar «does» porque el verbo principal va en presente simple.", terminos: [layout shift] }
  - { id: b2-frontend-01-e8, tipo: opcion_multiple, enunciado: "According to Elena, when should we use aria attributes?", opciones: ["Only when no native element exists.", "On every element of the page.", "Never, because they are obsolete."], correcta: 0, explicacion: "Elena recuerda que hay que preferir los elementos nativos y usar atributos aria solo cuando no hay un elemento HTML adecuado. El HTML semántico ya ofrece foco, teclado y significado para los lectores de pantalla.", terminos: [aria, semantic html] }
