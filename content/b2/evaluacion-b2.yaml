tipo: evaluacion
nivel: B2
revisado: false
recursos:
  - tipo: lectura
    id: b2-ev-l1
    titulo: The Release Nobody Smoke-Tested
    texto: |
      Last Friday, our team released a new version of the mobile app at five o'clock. The release was approved quickly, because the pipeline was green and the deadline was close. Within an hour, customers began to report that they could not log in. The incident lasted two hours, and about 4,000 users were affected.

      Having reviewed the logs, the team found the cause: a configuration value was missing in production. If the team had run a smoke test after the deployment, they would have found the problem in a few minutes. The unit tests had passed, but they could not have detected the error, because they used a different configuration.

      During the postmortem, Carla, the QA lead, said that the team should have blocked the release until a manual check was done. Pablo admitted skipping the smoke test, and he explained that nobody had asked him to run it. Carla insisted that the goal was to improve the process, not to blame a person.

      Three actions were agreed: add an automatic smoke test as a quality gate, prepare a rollback for every release, and send a short report to the stakeholders. Although this will add five minutes to each release, the team is sure that it will prevent similar incidents.
  - tipo: lectura
    id: b2-ev-l2
    titulo: Why We Moved to Server-Side Rendering
    texto: |
      For three years, our online store was a client-side application. The server sent an almost empty page, and the browser had to download a large bundle before showing anything. Not only was the first load slow, but search engines also had trouble indexing our products.

      Last spring, the team, which is led by Elena, decided to move to server-side rendering. What surprised everyone was the effect on the first render: the content appeared after 1.2 seconds instead of four. However, a new problem appeared. Between the moment the page became visible and the moment it became interactive, users clicked buttons that did not respond. The team found out that this was caused by hydration, the step in which JavaScript attaches to the HTML.

      To reduce the delay, Elena asked the developers to apply code splitting, and the main bundle became 40 percent smaller. She also had an external company perform an accessibility audit. The audit found that several buttons were built with div elements and could not be used with a keyboard. "Never again will we use a div for a button," Elena said.

      By the end of the year, the team will have replaced all the old components with semantic HTML. Although the project took longer than expected, the results are clear.
