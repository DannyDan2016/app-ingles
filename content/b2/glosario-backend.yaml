tipo: glosario
nivel: B2
tema: backend
entradas:
  - { termino: idempotent, categoria: adjective, traduccion_es: "idempotente (repetirlo da el mismo efecto)", definicion_en: "Describes an operation that has the same effect whether you run it once or many times.", ejemplo_en: "A payment endpoint should be idempotent.", nivel: B2, tema: backend }
  - { termino: consistency, categoria: noun, traduccion_es: "consistencia (de los datos)", definicion_en: "The property that all copies of the data show the same values.", ejemplo_en: "A read replica can have a small delay in consistency.", nivel: B2, tema: backend }
  - { termino: replication, categoria: noun, traduccion_es: replicación, definicion_en: "The process of keeping copies of a database on several servers.", ejemplo_en: "Replication gives us high availability.", nivel: B2, tema: backend }
  - { termino: sharding, categoria: noun, traduccion_es: "fragmentación horizontal (sharding)", definicion_en: "Splitting a large database into smaller parts that are stored on different servers.", ejemplo_en: "Sharding allows horizontal scaling of the data.", nivel: B2, tema: backend }
  - { termino: deadlock, categoria: noun, traduccion_es: "bloqueo mutuo (deadlock)", definicion_en: "A situation in which two transactions wait for each other and neither can continue.", ejemplo_en: "The database returned a deadlock error.", nivel: B2, tema: backend }
  - { termino: normalization, categoria: noun, traduccion_es: "normalización (de una base de datos)", definicion_en: "Organizing tables so that data is not repeated.", ejemplo_en: "Too much normalization means many joins.", nivel: B2, tema: backend }
  - { termino: migration, categoria: noun, traduccion_es: "migración (cambio de esquema o de sistema)", definicion_en: "A change that moves data or modifies the structure of a database.", ejemplo_en: "The migration added a new column to the orders table.", nivel: B2, tema: backend }
  - { termino: orm, categoria: noun, traduccion_es: "ORM (mapeo objeto-relacional)", definicion_en: "A tool that lets you use database tables as objects in your programming language.", ejemplo_en: "The ORM generates SQL that nobody reads.", nivel: B2, tema: backend }
  - { termino: concurrency, categoria: noun, traduccion_es: concurrencia, definicion_en: "The situation in which many operations or users act at the same time.", ejemplo_en: "High concurrency can cause locks.", nivel: B2, tema: backend }
  - { termino: query plan, categoria: noun, traduccion_es: "plan de ejecución de una consulta", definicion_en: "The steps that a database chooses to run a query.", ejemplo_en: "The query plan shows a full table scan.", nivel: B2, tema: backend }
  - { termino: connection pool, categoria: noun, traduccion_es: "pool de conexiones", definicion_en: "A set of open database connections that the application reuses.", ejemplo_en: "Requests wait when the connection pool is full.", nivel: B2, tema: backend }
  - { termino: read replica, categoria: noun, traduccion_es: "réplica de lectura", definicion_en: "A copy of a database that only answers read queries.", ejemplo_en: "Reports should run on a read replica.", nivel: B2, tema: backend }
  - { termino: isolation level, categoria: noun, traduccion_es: "nivel de aislamiento", definicion_en: "A setting that controls how much a transaction can see the changes of other transactions.", ejemplo_en: "A lower isolation level can reduce the locks.", nivel: B2, tema: backend }
  - { termino: observability, categoria: noun, traduccion_es: observabilidad, definicion_en: "The ability to understand what happens inside a system by looking at its metrics, logs and traces.", ejemplo_en: "Better observability helps us to find slow requests.", nivel: B2, tema: backend }
  - { termino: tracing, categoria: noun, traduccion_es: "trazado distribuido (tracing)", definicion_en: "Following a single request through all the services that handle it.", ejemplo_en: "Tracing shows which service makes the request slow.", nivel: B2, tema: backend }
  - { termino: slo, categoria: noun, traduccion_es: "SLO (objetivo de nivel de servicio)", definicion_en: "A target for the reliability of a service, for example 99.9 percent availability.", ejemplo_en: "The SLO for checkout is 99.9 percent.", nivel: B2, tema: backend }
  - { termino: failover, categoria: noun, traduccion_es: "conmutación por error (failover)", definicion_en: "An automatic switch to a backup system when the main one fails.", ejemplo_en: "We need a proper failover for the database.", nivel: B2, tema: backend }
  - { termino: circuit breaker, categoria: noun, traduccion_es: "disyuntor / cortacircuitos (circuit breaker)", definicion_en: "A pattern that stops calls to a service that keeps failing, to protect the rest of the system.", ejemplo_en: "The circuit breaker opens when the failure threshold is exceeded.", nivel: B2, tema: backend }
  - { termino: backpressure, categoria: noun, traduccion_es: "contrapresión (backpressure)", definicion_en: "A mechanism that tells a fast sender to slow down when the receiver cannot keep up.", ejemplo_en: "The queue applies backpressure when a consumer is too slow.", nivel: B2, tema: backend }
  - { termino: orchestration, categoria: noun, traduccion_es: orquestación, definicion_en: "The automatic coordination of many services or containers.", ejemplo_en: "The orchestration files start the services in the correct order.", nivel: B2, tema: backend }
  - { termino: blue-green deployment, categoria: noun, traduccion_es: "despliegue blue-green", definicion_en: "A release method with two identical environments, in which traffic is switched to the new one.", ejemplo_en: "A blue-green deployment makes a rollback take seconds.", nivel: B2, tema: backend }
  - { termino: canary release, categoria: noun, traduccion_es: "lanzamiento canario", definicion_en: "A release method in which only a small group of users receives the new version first.", ejemplo_en: "Only five percent of users see the canary release.", nivel: B2, tema: backend }
  - { termino: infrastructure as code, categoria: noun, traduccion_es: "infraestructura como código", definicion_en: "Describing servers and networks in files that are reviewed and versioned like code.", ejemplo_en: "With infrastructure as code, every environment is the same.", nivel: B2, tema: backend }
  - { termino: graceful degradation, categoria: noun, traduccion_es: "degradación elegante", definicion_en: "The ability of a system to keep working with fewer features when a part fails.", ejemplo_en: "Showing popular products is a form of graceful degradation.", nivel: B2, tema: backend }
  - { termino: api gateway, categoria: noun, traduccion_es: "pasarela de API", definicion_en: "A single entry point that receives all API requests and sends them to the right services.", ejemplo_en: "The API gateway has a quota for each client.", nivel: B2, tema: backend }
  - { termino: error budget, categoria: noun, traduccion_es: "presupuesto de errores", definicion_en: "The amount of failure that an SLO allows in a period of time.", ejemplo_en: "Our error budget is about 43 minutes per month.", nivel: B2, tema: backend }
