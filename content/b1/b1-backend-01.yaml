tipo: leccion
id: b1-backend-01
nivel: B1
tema: backend
orden: 7
titulo: A Service That Stores Orders
objetivo: Puedo definir y describir componentes de un backend usando frases con «that», «which» y «who».
gramatica: "Defining relative clauses (who, which, that, where)"
lectura: |
  Ben is a junior developer who has just joined an online shop. On his first day, his teammate Sara explains how the system works.

  "Our shop keeps every order as a [[record]] in a [[relational]] database. The [[schema]] is the structure that describes the data. Each order is one [[row]] in the orders table, which also has a column for the customer."

  "When a customer clicks Buy, the app sends a [[payload]] that contains the product and the quantity. Before we save it, the server must [[validate]] the data. A user who is not logged in cannot create an order, so the server checks the [[session]] first. [[Authentication]] is the process that confirms who the user is."

  "To show the order history, we write a [[query]] that asks the database for the right rows. A [[join]] is the part of a query that connects two tables, for example orders and customers. If the table is big, the query can be slow, so we add an [[index]], which works like the index of a book. We also use a [[cache]], a fast place where we keep answers that people ask for many times. Finally, a [[transaction]] makes sure that the payment and the order are saved together, or not saved at all."
video: { youtubeId: R0XlH8FUEc8, start: 0, end: 68, titulo: "Relational vs. NoSQL: databases explained simply", canal: "Google Cloud" }
terminos: [query, schema, record, index, transaction, authentication, session, cache, validate, payload, relational, row, join]
ejercicios:
  - { id: b1-backend-01-e1, tipo: opcion_multiple, enunciado: "Elige la palabra correcta: A query is a request ___ asks the database for data.", opciones: ["that", "who", "where"], correcta: 0, explicacion: "Para cosas usamos «that» (o «which»). «Who» es solo para personas y «where» para lugares.", terminos: [query] }
  - { id: b1-backend-01-e2, tipo: opcion_multiple, enunciado: "Elige la palabra correcta: A user ___ is not logged in cannot create an order.", opciones: ["who", "which", "where"], correcta: 0, explicacion: "Hablamos de una persona (a user), así que usamos «who». «Which» es para cosas y «where» para lugares." }
  - { id: b1-backend-01-e3, tipo: completar, enunciado: "Completa con who, which, that o where.", texto: "This is the table ___ we keep all the orders.", respuesta: where, aceptadas: ["in which"], explicacion: "«Where» se usa para lugares: aquí, la tabla es el lugar donde guardamos los pedidos. En un registro más formal también vale «in which»." }
  - { id: b1-backend-01-e4, tipo: completar, enunciado: "Completa la definición.", texto: "An index is a structure ___ makes a query faster.", respuesta: that, aceptadas: [which], explicacion: "«That» y «which» se pueden usar para cosas. Aquí hacen de sujeto de «makes», por eso no se pueden quitar.", terminos: [index, query] }
  - { id: b1-backend-01-e5, tipo: ordenar, enunciado: "Ordena la definición.", piezas: ["Authentication", "is the process", "that", "confirms", "who the user is"], explicacion: "Estructura: sujeto + is + nombre + that + verbo + complemento. La cláusula con «that» define de qué proceso hablamos.", terminos: [authentication] }
  - { id: b1-backend-01-e6, tipo: emparejar, enunciado: "Empareja cada término con su definición.", pares: [{ a: schema, b: "the structure that describes the data" }, { a: cache, b: "a fast place that keeps repeated answers" }, { a: join, b: "the part of a query that connects two tables" }, { a: transaction, b: "changes that are saved together" }], explicacion: "Cada definición usa una cláusula de relativo con «that» para decir qué es el término.", terminos: [schema, cache, join, transaction] }
  - { id: b1-backend-01-e7, tipo: verdadero_falso, enunciado: "Según la lectura, ¿verdadero o falso?", afirmacion: "The server checks the session after it saves the order.", correcta: false, explicacion: "La lectura dice que el servidor valida los datos antes de guardarlos y comprueba la sesión primero, porque un usuario sin sesión no puede crear pedidos.", terminos: [session, validate] }
  - { id: b1-backend-01-e8, tipo: opcion_multiple, enunciado: "Why does the team add an index to a big table?", opciones: ["To make queries faster", "To validate the payload", "To end the session"], correcta: 0, explicacion: "Un índice funciona como el índice de un libro: ayuda a la base de datos a encontrar las filas sin leer toda la tabla.", terminos: [index, query] }
