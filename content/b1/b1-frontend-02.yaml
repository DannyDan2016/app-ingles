tipo: leccion
id: b1-frontend-02
nivel: B1
tema: frontend
orden: 11
titulo: If We Had More Time, We Would Add Dark Mode
objetivo: Puedo hablar de mejoras hipotéticas y dar consejo a un compañero («If I were you...»).
gramatica: "Second conditional (If we had more time, we would add dark mode; If I were you, I would lazy load the images) y should/shouldn't para dar consejo"
lectura: |
  The team is planning the next sprint, but there is not enough time for everything. Lena, the lead developer, opens the list.

  "If we had more time, we would add [[dark mode]]," she says. "Users keep asking for it. But if we built it now, we wouldn't finish the form [[validation]]."

  Omar shakes his head. "If I were you, I would start with [[performance]]. Our [[bundle]] is too big, so the first screen is slow. If we used [[lazy loading]], the page would load much faster. We shouldn't load every image at the start."

  "Good point. And the new [[animation]]?" Lena asks.

  "It's nice, but it isn't essential. You shouldn't spend a whole week on it."

  Then Priya, a junior developer, explains a problem. She is [[debugging|debug]] the shopping cart. The page uses [[fetch]] to ask the server for data, and the request is [[asynchronous]], so the data arrives later. The cart reads the data with an old helper function. "If I passed the right [[callback]] to the helper, it would work," she says, "but I also send the wrong [[props]] to the child component."

  "You should read the docs first," Omar says. "That old helper is [[deprecated]]. We should [[refactor]] this part before it breaks."

  Lena writes the plan: performance first, validation second, and dark mode for the next sprint.
