  - tipo: lectura
    id: b1-ev-l1
    titulo: The Chatbot That Invented a Date
    texto: |
      Last month, our support team added a chatbot that summarizes customer tickets. The model has been trained on ten thousand old tickets, and its accuracy is now 91 percent. At first, everyone was happy.

      One Friday, while Elena was reading a summary, she noticed a strange detail. The chatbot said that the new release was published on March 3, but the ticket never mentioned a date. This was a hallucination: the model had made an assumption and presented it as a fact. Elena was surprised because the rest of the summary was correct.

      Elena and her colleague Marco decided to investigate. They found that many prompts were too vague. For example, the prompt "Summarize this ticket" gave no context and no format. If a prompt does not include constraints, the model sometimes fills the gaps with invented information.

      So they refined the prompt. The new version asks for three lines, tells the model to use only the text of the ticket, and says that it must write "unknown" when a detail is missing. After the change, the hallucinations were reduced a lot.

      Now the team has a simple rule: every summary must be verified against the original source before it is sent to a customer. Marco says that a reliable assistant is not a perfect assistant, but one whose mistakes are easy to find.
  - tipo: lectura
    id: b1-ev-l2
    titulo: Orders Lost at Night
    texto: |
      Our online shop receives about two thousand orders every hour. For a long time, the order service saved each order directly in the database. It worked well until last winter, when sales grew fast. During a big promotion, the database became a bottleneck, and the latency went from 200 milliseconds to six seconds. Some requests failed, and a few orders were lost.

      Priya, the backend engineer, proposed to use a queue. With a queue, the service does not write to the database immediately. It puts each order in a line, and a worker, which is a small program that reads the line, saves the orders one by one. If the database is slow, the orders wait safely instead of disappearing.

      The team also added a retry: when the worker fails to save an order, it tries again up to three times. If the order still fails, it is moved to a separate queue so that an engineer can check it. Priya also set an alert that is sent when more than five hundred orders are waiting in the line.

      The new system was tested in a staging environment before it was released. During the next promotion, the latency stayed under 300 milliseconds, and no order was lost. Priya says that the best part of the change is that the team can now scale the workers without touching the database.
