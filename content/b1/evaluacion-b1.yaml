    recurso: b1-ev-l2
    tipo: completar
    enunciado: "Completa con el número según la lectura."
    texto: "When the worker fails to save an order, it tries again up to ___ times."
    respuesta: three
    aceptadas: ["3", "Three"]
    explicacion: "El texto dice «it tries again up to three times». Esa repetición automática es un retry. «Up to» significa «como máximo»."
