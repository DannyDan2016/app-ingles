tipo: glosario
nivel: B1
tema: frontend
entradas:
  - { termino: component, categoria: noun, traduccion_es: componente, definicion_en: A reusable piece of a user interface with its own code and style., ejemplo_en: "The login form is a separate component.", nivel: B1, tema: frontend }
  - { termino: framework, categoria: noun, traduccion_es: framework (marco de trabajo), definicion_en: A set of tools and rules that gives structure to an application., ejemplo_en: "Our team chose a framework to build the dashboard.", nivel: B1, tema: frontend }
  - { termino: state, categoria: noun, traduccion_es: estado (de la interfaz), definicion_en: The data that describes how a component looks at a given moment., ejemplo_en: "When the state changes, the page updates.", nivel: B1, tema: frontend }
  - { termino: render, categoria: verb, traduccion_es: renderizar (dibujar en pantalla), definicion_en: To turn code and data into what the user sees on the page., ejemplo_en: "The component renders again when its state changes.", nivel: B1, tema: frontend }
  - { termino: event, categoria: noun, traduccion_es: evento, definicion_en: An action in the page, such as a click or a key press., ejemplo_en: "A click event starts the search.", nivel: B1, tema: frontend }
  - { termino: dom, categoria: noun, traduccion_es: DOM (modelo de objetos del documento), definicion_en: The tree of objects that represents the page in the browser., ejemplo_en: "JavaScript can read and change the DOM.", nivel: B1, tema: frontend }
  - { termino: accessibility, categoria: noun, traduccion_es: accesibilidad, definicion_en: Making a website usable for everyone, including people with disabilities., ejemplo_en: "Good accessibility means the site works with a keyboard.", nivel: B1, tema: frontend }
  - { termino: viewport, categoria: noun, traduccion_es: viewport (área visible de la página), definicion_en: The visible area of a web page on the user's device., ejemplo_en: "We test the layout in a small viewport.", nivel: B1, tema: frontend }
  - { termino: breakpoint, categoria: noun, traduccion_es: punto de ruptura (breakpoint), definicion_en: The screen width at which the layout changes., ejemplo_en: "The menu changes at a breakpoint of 768 pixels.", nivel: B1, tema: frontend }
  - { termino: stylesheet, categoria: noun, traduccion_es: hoja de estilos, definicion_en: A file with the rules that control how a page looks., ejemplo_en: "All the colors are defined in one stylesheet.", nivel: B1, tema: frontend }
  - { termino: element, categoria: noun, traduccion_es: elemento (de la página), definicion_en: One part of an HTML page, such as a button or a title., ejemplo_en: "Each element has a tag and can have attributes.", nivel: B1, tema: frontend }
  - { termino: attribute, categoria: noun, traduccion_es: atributo, definicion_en: Extra information inside an HTML tag, such as alt or href., ejemplo_en: "Add an alt attribute to every image.", nivel: B1, tema: frontend }
  - { termino: library, categoria: noun, traduccion_es: librería (biblioteca de código), definicion_en: Code written by others that you can use to solve common tasks., ejemplo_en: "We use a small library to format dates.", nivel: B1, tema: frontend }
  - { termino: validation, categoria: noun, traduccion_es: validación, definicion_en: Checking that the data a user enters is correct., ejemplo_en: "Form validation shows an error if the email is wrong.", nivel: B1, tema: frontend }
  - { termino: animation, categoria: noun, traduccion_es: animación, definicion_en: Movement or change on the screen that happens over time., ejemplo_en: "The button has a short animation when you click it.", nivel: B1, tema: frontend }
  - { termino: performance, categoria: noun, traduccion_es: rendimiento, definicion_en: How fast and smoothly a page loads and responds., ejemplo_en: "Large images are bad for performance.", nivel: B1, tema: frontend }
  - { termino: bundle, categoria: noun, traduccion_es: paquete (bundle) de código, definicion_en: A file that joins many pieces of code so the browser can load them., ejemplo_en: "Our JavaScript bundle is too big.", nivel: B1, tema: frontend }
  - { termino: lazy loading, categoria: noun, traduccion_es: carga diferida, definicion_en: Loading an image or code only when the user needs it., ejemplo_en: "Lazy loading makes the first screen faster.", nivel: B1, tema: frontend }
  - { termino: props, categoria: noun, traduccion_es: props (propiedades de un componente), definicion_en: Values that a parent component passes to a child component., ejemplo_en: "The title is passed to the card as a prop.", nivel: B1, tema: frontend }
  - { termino: callback, categoria: noun, traduccion_es: callback (función de retorno), definicion_en: A function that you give to another function to run later., ejemplo_en: "The callback runs when the data arrives.", nivel: B1, tema: frontend }
  - { termino: fetch, categoria: verb, traduccion_es: obtener datos (hacer una petición), definicion_en: To request data from a server., ejemplo_en: "The page fetches the product list when it opens.", nivel: B1, tema: frontend }
  - { termino: asynchronous, categoria: adjective, traduccion_es: asíncrono, definicion_en: Not happening in a fixed order; the code continues while it waits., ejemplo_en: "An asynchronous request does not block the page.", nivel: B1, tema: frontend }
  - { termino: debug, categoria: verb, traduccion_es: depurar (buscar y corregir errores), definicion_en: To find and fix errors in code., ejemplo_en: "I debug the page with the browser tools.", nivel: B1, tema: frontend }
  - { termino: deprecated, categoria: adjective, traduccion_es: obsoleto (en desuso), definicion_en: Still works, but developers should stop using it., ejemplo_en: "This function is deprecated and will be removed.", nivel: B1, tema: frontend }
  - { termino: refactor, categoria: verb, traduccion_es: refactorizar, definicion_en: To improve the structure of code without changing what it does., ejemplo_en: "We refactor the old form to make it simpler.", nivel: B1, tema: frontend }
  - { termino: dark mode, categoria: noun, traduccion_es: modo oscuro, definicion_en: A color theme with dark backgrounds and light text., ejemplo_en: "Many users prefer dark mode at night.", nivel: B1, tema: frontend }
