preguntas:
  - { id: b1-backend-t1-e1, tipo: verdadero_falso, enunciado: "¿Verdadero o falso?", afirmacion: "A REST API lets a client and a server exchange data over HTTP.", correcta: true, explicacion: "Una API REST es una forma de que un cliente y un servidor intercambien datos usando HTTP." }
  - { id: b1-backend-t1-e2, tipo: opcion_multiple, enunciado: "What does the client send to a REST API?", opciones: ["A request", "A schema", "A container"], correcta: 0, explicacion: "El cliente envía una petición (request) y la API responde. Esquema y contenedor son conceptos distintos." }
