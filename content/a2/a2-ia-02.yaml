tipo: leccion
id: a2-ia-02
nivel: A2
tema: ia
orden: 2
titulo: Ask the AI Clearly
objetivo: Puedo dar instrucciones claras y ordenadas a una IA, paso a paso.
gramatica: Imperatives (please, don't, first/then)
lectura: |
  Marta is a senior developer. She gives Leo four [[steps|step]] to ask an AI for help.

  First, write a [[short]] and [[clear]] [[prompt]]. Please don't write a long text. Second, give an [[example]]. For instance, say: "[[Explain]] this error in simple words." Third, ask for a [[list]]: "List three possible causes." Then [[check]] the [[result]]. Don't [[copy]] it fast, because the AI can make a [[mistake]].

  Leo also needs help in Spanish sometimes, and he is a little nervous. Marta smiles and says that a good prompt is like a good message to a teammate. Marta says: "Please [[translate]] one sentence at a time, and read each one carefully." Leo writes the four steps on a sticky note. Now he can ask the AI for help with a clear plan, and he is ready to try it today.
video: { youtubeId: T_-2M_1pgoE, start: 15, end: 85, titulo: "Prompt Engineering for Beginners: System Prompts, Examples & AI Safety", canal: "LearnFree" }
terminos: [prompt, example, short, clear, explain, list, translate, check, copy, result, step, mistake]
ejercicios:
  - { id: a2-ia-02-e1, tipo: ordenar, enunciado: "Ordena el imperativo.", piezas: ["Write", "a", "short", "prompt"], explicacion: "El imperativo empieza con el verbo base, sin sujeto: «Write a short prompt».", terminos: [prompt, short] }
  - { id: a2-ia-02-e2, tipo: emparejar, enunciado: "Empareja cada término con su definición.", pares: [{ a: prompt, b: "the text you send to an AI" }, { a: example, b: "a sample that shows what you want" }, { a: result, b: "what the AI gives you back" }, { a: mistake, b: "something that is not correct" }], explicacion: "Conocer estas definiciones en inglés te ayuda a leer la documentación de las herramientas de IA.", terminos: [prompt, example, result, mistake] }
  - { id: a2-ia-02-e3, tipo: opcion_multiple, enunciado: "Which prompt is the clearest?", opciones: ["Help me with code.", "Explain this error in two simple sentences.", "Error? Why? Fix."], correcta: 1, explicacion: "Un buen prompt es corto pero concreto: dice qué hacer (explain), sobre qué (this error) y cómo (two simple sentences).", terminos: [prompt, clear, explain] }
  - { id: a2-ia-02-e4, tipo: completar, enunciado: "Completa con el verbo en imperativo.", texto: "___ the result before you copy it.", respuesta: Check, aceptadas: ["check"], explicacion: "Marta recomienda comprobar el resultado antes de copiarlo: el imperativo es solo «check».", terminos: [check, result, copy] }
  - { id: a2-ia-02-e5, tipo: verdadero_falso, enunciado: "¿Verdadero o falso según la lectura?", afirmacion: "Marta says: write a very long prompt.", correcta: false, explicacion: "Marta dice «Please don't write a long text»: un prompt corto y claro funciona mejor.", terminos: [prompt, short] }
  - { id: a2-ia-02-e6, tipo: opcion_multiple, enunciado: "Which sentence is a negative imperative?", opciones: ["Copy it fast.", "Don't copy it fast.", "You don't copy it."], correcta: 1, explicacion: "El imperativo negativo se forma con don't + verbo base: «Don't copy it fast». No lleva sujeto.", terminos: [copy] }
  - { id: a2-ia-02-e7, tipo: ordenar, enunciado: "Ordena la instrucción con secuenciadores.", piezas: ["First", "write", "a", "prompt", "then", "check", "it"], explicacion: "«First» abre la secuencia y «then» introduce el paso siguiente. Cada paso es un imperativo.", terminos: [prompt, check] }
