entradas:
  - { termino: tester, categoria: noun, traduccion_es: tester (probador), definicion_en: A person who checks if software works well., ejemplo_en: The tester checks every new feature., nivel: A2, tema: qa }
  - { termino: bug, categoria: noun, traduccion_es: error / fallo (bug), definicion_en: A mistake in a program that causes a problem., ejemplo_en: The bug closes the app., nivel: A2, tema: qa }
  - { termino: login, categoria: noun, traduccion_es: inicio de sesión, definicion_en: The step where you enter your username and password., ejemplo_en: The login page is very slow., nivel: A2, tema: qa }
  - { termino: page, categoria: noun, traduccion_es: página, definicion_en: One screen of a website or an app., ejemplo_en: This page does not open., nivel: A2, tema: qa }
  - { termino: button, categoria: noun, traduccion_es: botón, definicion_en: A part of the screen that you click to do something., ejemplo_en: Click the blue button., nivel: A2, tema: qa }
  - { termino: screen, categoria: noun, traduccion_es: pantalla, definicion_en: The part of a device where you see things., ejemplo_en: The screen is white., nivel: A2, tema: qa }
  - { termino: click, categoria: verb, traduccion_es: hacer clic, definicion_en: To press a button with the mouse., ejemplo_en: I click the save button., nivel: A2, tema: qa }
  - { termino: find, categoria: verb, traduccion_es: encontrar, definicion_en: To see or discover something you were looking for., ejemplo_en: Testers find bugs before users do., nivel: A2, tema: qa }
  - { termino: report, categoria: noun, traduccion_es: "informe (to report: reportar)", definicion_en: A text that tells people about a problem or a result., ejemplo_en: I write a report for every bug I find., nivel: A2, tema: qa }
  - { termino: fix, categoria: verb, traduccion_es: arreglar, definicion_en: To repair a problem so it works again., ejemplo_en: The developer fixed the bug., nivel: A2, tema: qa }
  - { termino: password, categoria: noun, traduccion_es: contraseña, definicion_en: A secret word that lets you enter your account., ejemplo_en: My password has eight characters., nivel: A2, tema: qa }
  - { termino: message, categoria: noun, traduccion_es: mensaje, definicion_en: Words that the app shows or sends to you., ejemplo_en: An error message appeared., nivel: A2, tema: qa }
  - { termino: developer, categoria: noun, traduccion_es: desarrollador, definicion_en: A person who writes software., ejemplo_en: The developer reads my report., nivel: A2, tema: qa }
  - { termino: test case, categoria: noun, traduccion_es: caso de prueba, definicion_en: A written test with steps and a result to check., ejemplo_en: This test case checks the payment button., nivel: A2, tema: qa }
  - { termino: expected result, categoria: noun, traduccion_es: resultado esperado, definicion_en: What should happen when the software works well., ejemplo_en: The expected result is a success message., nivel: A2, tema: qa }
  - { termino: step, categoria: noun, traduccion_es: paso, definicion_en: One action in a list of actions that you do one after another., ejemplo_en: Write the steps in a clear list., nivel: A2, tema: qa }
