  - { termino: fail, categoria: verb, traduccion_es: fallar, definicion_en: To finish a test without the expected result., ejemplo_en: The test fails on mobile., nivel: A2, tema: qa }
  - { termino: requirement, categoria: noun, traduccion_es: requisito, definicion_en: Something the software must do., ejemplo_en: Each requirement needs a test., nivel: A2, tema: qa }
  - { termino: browser, categoria: noun, traduccion_es: navegador, definicion_en: A program for visiting websites, like Chrome., ejemplo_en: Test the page in two browsers., nivel: A2, tema: qa }
  - { termino: mobile, categoria: adjective, traduccion_es: móvil, definicion_en: Made for phones and small devices., ejemplo_en: The mobile page looks different., nivel: A2, tema: qa }
  - { termino: automated test, categoria: noun, traduccion_es: prueba automatizada, definicion_en: A test that a program runs by itself., ejemplo_en: An automated test runs every night., nivel: A2, tema: qa }
  - { termino: screenshot, categoria: noun, traduccion_es: captura de pantalla, definicion_en: A picture of what you see on your screen., ejemplo_en: Add a screenshot to the report., nivel: A2, tema: qa }
