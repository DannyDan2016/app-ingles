tipo: leccion
id: a2-qa-02
nivel: A2
tema: qa
orden: 5
titulo: What Should We Test?
objetivo: Puedo expresar obligaciones, permisos y consejos en un plan de pruebas.
gramatica: can/can't, must/mustn't, should; because
lectura: |
  The team is ready to test the payment page. Marta, the lead, explains the plan.

  "You must test the page on [[mobile]], because many users pay with their phones. You must also test it in two [[browsers|browser]]. You can choose Chrome and Firefox, or Chrome and Safari. You should write clear [[steps|step]] and the [[expected result]] in every [[test case]]. You should add a [[screenshot]] when a test [[fails|fail]]."

  Tom asks about the [[environment]]. Marta says, "You must use the test environment. You mustn't use real customer data."

  Then she talks about [[priority]]. "This [[requirement]] is about payments, so it has high priority. You can't [[release]] the app with a failed test. An [[automated test]] can run every night, and you should check in the morning if all the tests [[pass]]."
video: { youtubeId: Biynpm4x4Ig, start: 30, end: 100, titulo: "Unit Testing Explained: What It Is and How It Works", canal: "QA Unlocked" }
terminos: [test case, expected result, step, pass, fail, requirement, browser, mobile]
ejercicios:
  - id: a2-qa-02-e1
    tipo: opcion_multiple
    enunciado: "Choose the correct word: You ___ release the app with a failed test."
    opciones: ["can't", "can", "should"]
    correcta: 0
    explicacion: "«Can't» expresa que algo no está permitido. Publicar con una prueba fallida no está permitido; «can» lo permitiría y «should» lo recomendaría."
    terminos: [fail, release]
  - id: a2-qa-02-e2
    tipo: opcion_multiple
    enunciado: "Which sentence is a strong rule (obligation)?"
    opciones: ["You should add a screenshot.", "You must test on mobile.", "You can choose Chrome and Firefox."]
    correcta: 1
    explicacion: "«Must» expresa obligación fuerte. «Should» es un consejo y «can» es un permiso o posibilidad."
    terminos: [mobile]
  - id: a2-qa-02-e3
    tipo: completar
    enunciado: Completa con must, mustn't, should o can.
    texto: "You ___ use real customer data in the test environment."
    respuesta: "mustn't"
    aceptadas: ["must not"]
    explicacion: "«Mustn't» expresa una prohibición fuerte: está prohibido usar datos reales de clientes en el entorno de pruebas (son datos personales)."
    terminos: [environment]
  - id: a2-qa-02-e4
    tipo: completar
    enunciado: Completa con must, mustn't, should o can.
    texto: "You ___ write the expected result in every test case. It is a good idea."
    respuesta: should
    explicacion: "«It is a good idea» indica un consejo: «should» recomienda algo, pero no es una obligación fuerte como «must»."
    terminos: [expected result, test case]
  - id: a2-qa-02-e5
    tipo: completar
    enunciado: Completa con la palabra que da la razón.
    texto: "We test on mobile ___ many users pay with their phones."
    respuesta: because
    aceptadas: ["since"]
    explicacion: "«Because» introduce la razón («porque») y responde a la pregunta «why?»."
    terminos: [mobile]
  - id: a2-qa-02-e6
    tipo: ordenar
    enunciado: Ordena las palabras para formar la frase.
    piezas: ["You", "should", "add", "a", "screenshot"]
    explicacion: "Después de «should» va el verbo en forma base, sin «to» ni -s: should add."
    terminos: [screenshot]
  - id: a2-qa-02-e7
    tipo: emparejar
    enunciado: Empareja cada término con su significado.
    pares: [{ a: test case, b: prueba escrita con pasos y resultado }, { a: expected result, b: lo que debería pasar }, { a: requirement, b: algo que el software debe hacer }, { a: priority, b: lo urgente o importante que es algo }]
    explicacion: "Estos cuatro términos aparecen en cualquier plan de pruebas. El resultado esperado se compara con el resultado real para saber si la prueba pasa o falla."
    terminos: [test case, expected result, requirement, priority]
  - id: a2-qa-02-e8
    tipo: verdadero_falso
    enunciado: "¿Verdadero o falso según la lectura?"
    afirmacion: "The team can test the page in only one browser."
    correcta: false
    explicacion: "Marta dice «You must also test it in two browsers»: es una obligación. Lo que sí pueden elegir («can») es qué dos navegadores usar."
    terminos: [browser]
revisado: true
