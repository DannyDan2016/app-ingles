name: contenido-semanal
# Cada lunes comprueba que los videos del contenido siguen disponibles (oEmbed) y abre un issue si alguno cae.
on:
  schedule: [{ cron: "0 13 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - id: check
        run: npm run content:check-videos > videos.log 2>&1 || echo "fallo=1" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.fallo == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          titulo="Videos del contenido no disponibles"
          existente=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$titulo in:title" --json number,title --jq "[.[] | select(.title | startswith(\"$titulo\"))][0].number // empty")
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --repo "$GITHUB_REPOSITORY" --body-file videos.log
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo ($(date -u +%F))" --body-file videos.log
          fi
