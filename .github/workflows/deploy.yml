name: deploy
# Se dispara cuando termina `ci`. Solo se publica si ci fue verde en un PUSH a main
# del propio repositorio (nunca forks ni PRs). Flujo: preview -> puerta-seguridad -> produccion.
# Secrets por GitHub Environment: ver README ("Despliegue"). Cada secret entra por `env:` solo en el
# paso que lo usa (nunca a nivel de job, para que no lo vean los scripts de dependencias de npm ci),
# y nunca interpolado dentro de `run:`. `npm ci --ignore-scripts`: ningún paquete ejecuta código de
# instalación en el runner (probado: build, drizzle-kit y playwright funcionan igual).
# Acciones fijadas por SHA; solo runners de GitHub.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    outputs:
      url: ${{ steps.dep.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Migraciones (URL directa de Neon preview)
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Falta el secret DATABASE_URL_UNPOOLED en el environment 'preview' (URL directa de Neon, sin pooler)."
            exit 1
          fi
          DATABASE_URL="$DATABASE_URL_UNPOOLED" npx drizzle-kit migrate
      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@62.5.0 pull --yes --environment=preview --token "$VERCEL_TOKEN"
      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@62.5.0 build --token "$VERCEL_TOKEN"
      - name: vercel deploy
        id: dep
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx --yes vercel@62.5.0 deploy --prebuilt --token "$VERCEL_TOKEN" | tail -n1)"
          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9-]+\.vercel\.app$'; then
            echo "::error::La URL del preview no tiene el formato esperado."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  puerta-seguridad:
    needs: [preview]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Instalación sin secrets en el entorno.
      - name: Instalar dependencias de tests
        working-directory: tests
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
      # Sin trazas (playwright.config) y sin subir informe: podría contener la cabecera de bypass.
      - name: E2E + API contra el preview
        working-directory: tests
        env:
          TEST_ENV: preview
          BASE_URL: ${{ needs.preview.outputs.url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          CI: "true"
        run: npm run test:preview
      # La cabecera de bypass se inyecta con las variables documentadas de ZAP
      # (ZAP_AUTH_HEADER*), limitadas al host del preview. El valor pasa por -e (sin valor en la línea de docker).
      # Imagen fijada por digest (2.17.0).
      - name: ZAP baseline sobre /login
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_BYPASS }}
        run: |
          chmod a+w .zap
          host="${PREVIEW_URL#https://}"
          docker run --rm -v "$PWD/.zap:/zap/wrk:rw"             -e ZAP_AUTH_HEADER=x-vercel-protection-bypass             -e ZAP_AUTH_HEADER_VALUE             -e ZAP_AUTH_HEADER_SITE="$host"             ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef             zap-baseline.py -t "$PREVIEW_URL/login" -c rules.tsv -I
          # -I: los WARN no rompen el job; las FAIL de .zap/rules.tsv sí (ver su cabecera).

  produccion:
    needs: [puerta-seguridad]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # El environment 'production' debe tener revisor obligatorio (configurado a mano en GitHub).
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Migraciones (URL directa de Neon main)
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Falta el secret DATABASE_URL_UNPOOLED en el environment 'production' (URL directa de Neon, sin pooler)."
            exit 1
          fi
          DATABASE_URL="$DATABASE_URL_UNPOOLED" npx drizzle-kit migrate
      - name: vercel pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@62.5.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@62.5.0 build --prod --token "$VERCEL_TOKEN"
      - name: vercel deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@62.5.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
