name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Todas las acciones van fijadas por SHA del commit del tag (comentario # vX.Y.Z).
# Solo runners alojados por GitHub (ubuntu-latest); nunca runners propios.
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo para gitleaks
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:no-pc
      # Solo dependencias de producción; las de desarrollo las vigila Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix tests --audit-level=high
      - name: gitleaks (historial completo)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --config /repo/.gitleaks.toml

  integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_only
          POSTGRES_DB: app_ingles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://app:app_ci_only@localhost:5432/app_ingles_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:int

  e2e:
    runs-on: ubuntu-latest
    needs: [calidad]
    env:
      CI: "true"
      COMPOSE_FILES: -f docker-compose.yml -f tests/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contraseña de admin efímera (solo existe en la BD de este job)
        run: |
          pw="$(openssl rand -base64 24)"
          echo "::add-mask::$pw"
          echo "E2E_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Stack y suite E2E
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES down -v
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d --build --wait web
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES run --rm --build tests
      - name: Logs del stack si falla
        if: failure()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES logs --no-color --tail=200
      - name: Limpieza
        if: always()
        run: |
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES down -v
      # Solo el informe; nunca tests/.auth (puede contener una cookie de bypass).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tests/playwright-report

  # Informe en Pages: solo en push a main y nunca pone el workflow en rojo
  # (si Pages no está activado, falla sin bloquear nada).
  reporte:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
    needs: [e2e]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
