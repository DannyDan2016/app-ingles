version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # react, react-dom (y sus tipos) y next (con su eslint-config) deben subir juntos.
    groups:
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"
          - "eslint-config-next"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react de eslint-config-next no soporta eslint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint no soporta TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tests
    schedule: { interval: weekly }
    # react y react-dom (y sus tipos) deben subir juntos.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react de eslint-config-next no soporta eslint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint no soporta TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # Nos quedamos en Node 24 LTS (crypto.argon2, .nvmrc): sin saltos de versión mayor.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /tests
    schedule: { interval: weekly }
